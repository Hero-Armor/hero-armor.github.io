<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900">
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto"><path d="M1,1 L8,4.5 L1,8" fill="none" stroke="#d81f1f" stroke-width="1.2"/></marker><marker id="fd81f1f" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#d81f1f"/></marker><marker id="f1f4fd8" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#1f4fd8"/></marker><marker id="f0b8a3e" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9 z" fill="#0b8a3e"/></marker></defs>
<rect width="1240" height="900" fill="#ffffff"/>
<text x="40.0" y="34.0" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#1b1b1b" text-anchor="start" font-weight="700">Ящик під станцію і генератор — план і розріз</text>
<text x="40.0" y="56.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">Габарити заліза — з офіційних сторінок EcoFlow. Габарит самого ящика — прикидка під ескіз, уточнюється після підтвердження моделі генератора.</text>
<text x="40.0" y="74.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">Головне на схемі не розміри, а три речі: рух повітря, вихід вихлопу і з чого зроблена перегородка.</text>
<text x="60.0" y="116.0" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="700">ПЛАН ЗГОРИ</text>
<rect x="52.0" y="122.0" width="604.0" height="234.4" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
<text x="670.0" y="142.0" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="400">фанера 12-15 мм</text>
<rect x="72.6" y="170.3" width="257.5" height="137.8" fill="#eef3ff" stroke="#9db4e8" stroke-width="1.4"/>
<text x="201.3" y="235.2" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="600">станція</text>
<text x="201.3" y="251.2" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#555" text-anchor="middle" font-weight="400">613×328 мм · 33.7 кг</text>
<rect x="338.5" y="130.0" width="37.8" height="218.4" fill="#fff6e8" stroke="#c2660a" stroke-width="1.8"/>
<text x="357.4" y="364.4" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#c2660a" text-anchor="middle" font-weight="700">перегородка</text>
<text x="357.4" y="378.4" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#c2660a" text-anchor="middle" font-weight="400">вата 50 мм + фольга</text>
<rect x="384.7" y="159.2" width="265.9" height="160.0" fill="#fdeeee" stroke="#e0a0a0" stroke-width="1.4"/>
<text x="517.6" y="235.2" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="600">генератор</text>
<text x="517.6" y="251.2" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#555" text-anchor="middle" font-weight="400">633×381 мм · 38 кг</text>
<line x1="650.5" y1="239.2" x2="713.5" y2="239.2" stroke="#d81f1f" stroke-width="2.4" marker-end="url(#fd81f1f)"/>
<text x="658.9" y="229.2" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#d81f1f" text-anchor="start" font-weight="700">вихлоп назовні</text>
<text x="658.9" y="253.2" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="400">гофра в металевій гільзі</text>
<line x1="34.8" y1="331.6" x2="68.4" y2="331.6" stroke="#1f4fd8" stroke-width="2.4" marker-end="url(#f1f4fd8)"/>
<text x="34.8" y="326.6" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#1f4fd8" text-anchor="start" font-weight="700">повітря входить</text>
<line x1="52.0" y1="404.4" x2="656.0" y2="404.4" stroke="#d81f1f" stroke-width="1.3" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="354.0" y="398.4" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#d81f1f" text-anchor="middle" font-weight="700">≈1400 мм — прикидка</text>
<text x="60.0" y="464.4" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="700">РОЗРІЗ</text>
<rect x="52.0" y="470.4" width="604.0" height="276.4" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
<rect x="72.6" y="572.9" width="257.5" height="165.9" fill="#eef3ff" stroke="#9db4e8" stroke-width="1.4"/>
<text x="201.3" y="651.9" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="600">станція</text>
<text x="201.3" y="667.9" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#555" text-anchor="middle" font-weight="400">395 мм заввишки</text>
<rect x="338.5" y="478.4" width="37.8" height="260.4" fill="#fff6e8" stroke="#c2660a" stroke-width="1.8"/>
<rect x="384.7" y="516.6" width="265.9" height="222.2" fill="#fdeeee" stroke="#e0a0a0" stroke-width="1.4"/>
<text x="517.6" y="623.7" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="middle" font-weight="600">генератор</text>
<text x="517.6" y="639.7" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#555" text-anchor="middle" font-weight="400">529 мм заввишки</text>
<line x1="64.2" y1="726.2" x2="64.2" y2="495.2" stroke="#1f4fd8" stroke-width="3" marker-end="url(#f1f4fd8)"/>
<text x="66.7" y="491.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#1f4fd8" text-anchor="start" font-weight="700">холодне знизу</text>
<line x1="517.6" y1="503.6" x2="517.6" y2="465.8" stroke="#0b8a3e" stroke-width="3" marker-end="url(#f0b8a3e)"/>
<text x="525.6" y="470.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#0b8a3e" text-anchor="start" font-weight="700">гаряче вгору + вентилятор</text>
<text x="60.0" y="772.8" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">станційний бік — нагнітання крізь фільтр, надлишковий тиск · генераторний — наскрізний продув із витяжкою вгору</text>
<text x="60.0" y="786.8" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#d81f1f" text-anchor="start" font-weight="600">перегородка мусить бути ГЕРМЕТИЧНОЮ, інакше витяжка генератора висмокче тиск зі станційного боку</text>
<line x1="52.0" y1="800.8" x2="656.0" y2="800.8" stroke="#d81f1f" stroke-width="1.3" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="354.0" y="794.8" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#d81f1f" text-anchor="middle" font-weight="700">висота ≈620 мм</text>
<text x="738.0" y="116.0" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#d81f1f" text-anchor="start" font-weight="700">ЧОГО НЕ МОЖНА</text>
<text x="738.0" y="144.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#d81f1f" text-anchor="start" font-weight="700">· Глухий ящик</text>
<text x="748.0" y="160.0" font-family="Arial,Helvetica,sans-serif" font-size="10.3" fill="#555" text-anchor="start" font-weight="400">Генератор засмоктує повітря і викидає гаряче.</text>
<text x="748.0" y="174.0" font-family="Arial,Helvetica,sans-serif" font-size="10.3" fill="#555" text-anchor="start" font-weight="400">Без наскрізного продуву це піч: паспортна</text>
<text x="748.0" y="188.0" font-family="Arial,Helvetica,sans-serif" font-size="10.3" fill="#555" text-anchor="start" font-weight="400">стеля 40 °C, на плайї в тіні і так під 40.</text>
<text x="738.0" y="218.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#d81f1f" text-anchor="start" font-weight="700">· Піна</text>
<text x="748.0" y="234.0" font-family="Arial,Helvetica,sans-serif" font-size="10.3" fill="#555" text-anchor="start" font-weight="400">Ні поліуретан, ні пінополістирол. Плавляться</text>
<text x="748.0" y="248.0" font-family="Arial,Helvetica,sans-serif" font-size="10.3" fill="#555" text-anchor="start" font-weight="400">і горять біля вихлопу. Тільки мінеральна вата</text>
<text x="748.0" y="262.0" font-family="Arial,Helvetica,sans-serif" font-size="10.3" fill="#555" text-anchor="start" font-weight="400">— вона негорюча.</text>
<text x="738.0" y="292.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#d81f1f" text-anchor="start" font-weight="700">· МДФ</text>
<text x="748.0" y="308.0" font-family="Arial,Helvetica,sans-serif" font-size="10.3" fill="#555" text-anchor="start" font-weight="400">Набирає вологу від першої роси і розбухає,</text>
<text x="748.0" y="322.0" font-family="Arial,Helvetica,sans-serif" font-size="10.3" fill="#555" text-anchor="start" font-weight="400">важчий за фанеру. Береза 12-15 мм робить те</text>
<text x="748.0" y="336.0" font-family="Arial,Helvetica,sans-serif" font-size="10.3" fill="#555" text-anchor="start" font-weight="400">саме легше і надійніше.</text>
<text x="738.0" y="366.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#d81f1f" text-anchor="start" font-weight="700">· Вихлоп у щілину</text>
<text x="748.0" y="382.0" font-family="Arial,Helvetica,sans-serif" font-size="10.3" fill="#555" text-anchor="start" font-weight="400">Тільки труба назовні і датчик чадного газу —</text>
<text x="748.0" y="396.0" font-family="Arial,Helvetica,sans-serif" font-size="10.3" fill="#555" text-anchor="start" font-weight="400">в ящику і в житлі.</text>
<text x="738.0" y="440.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#d81f1f" text-anchor="start" font-weight="700">· Паливо в ящику</text>
<text x="748.0" y="456.0" font-family="Arial,Helvetica,sans-serif" font-size="10.3" fill="#555" text-anchor="start" font-weight="400">Балон і каністра живуть окремо, з піддоном</text>
<text x="748.0" y="470.0" font-family="Arial,Helvetica,sans-serif" font-size="10.3" fill="#555" text-anchor="start" font-weight="400">під розлив.</text>
<text x="738.0" y="464.4" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="700">СТЕЛЯ ПО ТЕПЛУ</text>
<text x="738.0" y="490.4" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="400">генератор працює до 40 °C навколо</text>
<text x="738.0" y="508.4" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="400">станція заряджається до 45 °C</text>
<text x="738.0" y="526.4" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#1b1b1b" text-anchor="start" font-weight="400">найкраще станції — 20-30 °C</text>
<text x="738.0" y="544.4" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#0b8a3e" text-anchor="start" font-weight="400">тобто ящик мусить бути ХОЛОДНІШИЙ за вулицю,</text>
<text x="738.0" y="562.4" font-family="Arial,Helvetica,sans-serif" font-size="10.8" fill="#0b8a3e" text-anchor="start" font-weight="400">а не теплішим — звідси вентилятор, а не щілини</text>
</svg>
