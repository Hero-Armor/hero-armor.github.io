<text x="639.8" y="349.9" font-family="Arial,Helvetica,sans-serif" font-size="8.5" fill="#555" text-anchor="middle" font-weight="400">520×620</text>
<text x="604.7" y="451.4" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#a0a0a0" text-anchor="start" font-weight="400">сірим — залишок, з нього ідуть косинці</text>
<text x="829.4" y="92.0" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="700">АРКУШ 3</text>
<rect x="829.4" y="104.0" width="164.7" height="329.4" fill="#fcfcfc" stroke="#1b1b1b" stroke-width="1.8"/>
<rect x="829.4" y="104.0" width="85.7" height="193.1" fill="#eef3ff" stroke="#7f9ee0" stroke-width="1.1"/>
<text x="872.3" y="198.5" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#1b1b1b" text-anchor="middle" font-weight="600">стінка довга</text>
<text x="872.3" y="211.5" font-family="Arial,Helvetica,sans-serif" font-size="8.5" fill="#555" text-anchor="middle" font-weight="400">635×1430</text>
<text x="829.4" y="451.4" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#a0a0a0" text-anchor="start" font-weight="400">сірим — залишок, з нього ідуть косинці</text>
<text x="40.0" y="330.0" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#d81f1f" text-anchor="start" font-weight="700">ВАГА — ГОЛОВНА ПАСТКА ЦІЄЇ КОНСТРУКЦІЇ</text>
<text x="40.0" y="352.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="400">фанера 44 кг + генератор 38 кг + станція 33.7 кг = 116 кг</text>
<text x="40.0" y="371.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="400">стільки вдвох не піднімають і в кузов не подають. Три виходи:</text>
<text x="40.0" y="390.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">· колеса і ручка — ящик не носять, його котять;</text>
<text x="40.0" y="409.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">· кришка знімна, залізо виймається окремо — тоді носять 44 кг порожнього;</text>
<text x="40.0" y="428.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">· два ящики поруч, зчеплені болтами — кожен несуть окремо.</text>
<text x="40.0" y="447.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">12-мм фанера замість 15-мм знімає близько 9 кг і цього достатньо для стінок,</text>
<text x="40.0" y="466.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">але дно лишаємо 15 — на ньому стоїть уся вага.</text>
