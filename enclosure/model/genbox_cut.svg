<text x="40.0" y="34.0" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#1b1b1b" text-anchor="start" font-weight="700">Розкрій: із чого пиляємо ящик</text>
<text x="40.0" y="56.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">Аркуш фанери 4×8 футів = 1220×2440 мм, товщина 15 мм. Деталей 8, площа 4.68 м², аркушів треба 3.</text>
<text x="40.0" y="92.0" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="700">ДЕТАЛІ</text>
<text x="40.0" y="114.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="600">1 × дно</text>
<text x="200.0" y="114.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#555" text-anchor="start" font-weight="400">1430 × 550 мм</text>
<text x="40.0" y="136.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="600">1 × кришка</text>
<text x="200.0" y="136.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#555" text-anchor="start" font-weight="400">1430 × 550 мм</text>
<text x="40.0" y="158.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="600">2 × стінка довга</text>
<text x="200.0" y="158.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#555" text-anchor="start" font-weight="400">1430 × 635 мм</text>
<text x="40.0" y="180.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="600">2 × торець</text>
<text x="200.0" y="180.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#555" text-anchor="start" font-weight="400">520 × 620 мм</text>
<text x="40.0" y="202.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="600">2 × перегородка</text>
<text x="200.0" y="202.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#555" text-anchor="start" font-weight="400">520 × 620 мм</text>
<text x="40.0" y="232.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#d81f1f" text-anchor="start" font-weight="700">вага самої фанери ≈ 44 кг</text>
<text x="380.0" y="92.0" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="700">АРКУШ 1</text>
