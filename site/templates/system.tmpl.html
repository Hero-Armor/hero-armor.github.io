<title>{{PAGE_TITLE}}</title>
<style>
  :root {
    --bg: #edece5; --panel: #f7f6f1; --ink: #24231d; --ink-2: #6b675c;
    --line: #d8d5c9; --accent: #b35b1e; --signal: #3d6f96;
    --good: #3d7a4f; --warn: #b07c14; --crit: #b23a2e;
    --good-bg: #e3ede4; --warn-bg: #f2e9d2; --crit-bg: #f3ded9;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
    --disp: "Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
    --body: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181d; --panel: #1e2127; --ink: #e8e5dc; --ink-2: #9a968a;
      --line: #33363d; --accent: #e08b3e; --signal: #6fa3c9;
      --good: #6fbf87; --warn: #d9a83a; --crit: #e07a6a;
      --good-bg: #21301f; --warn-bg: #322a15; --crit-bg: #35201c; }
  }
  :root[data-theme="light"] {
    --bg: #edece5; --panel: #f7f6f1; --ink: #24231d; --ink-2: #6b675c;
    --line: #d8d5c9; --accent: #b35b1e; --signal: #3d6f96;
    --good: #3d7a4f; --warn: #b07c14; --crit: #b23a2e;
    --good-bg: #e3ede4; --warn-bg: #f2e9d2; --crit-bg: #f3ded9;
  }
  :root[data-theme="dark"] {
    --bg: #16181d; --panel: #1e2127; --ink: #e8e5dc; --ink-2: #9a968a;
    --line: #33363d; --accent: #e08b3e; --signal: #6fa3c9;
    --good: #6fbf87; --warn: #d9a83a; --crit: #e07a6a;
    --good-bg: #21301f; --warn-bg: #322a15; --crit-bg: #35201c;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--body);
         margin: 0; padding: 2rem 1.25rem 4rem; line-height: 1.5; }
  .wrap { max-width: 1060px; margin: 0 auto; }
  .eyebrow { font-family: var(--mono); font-size: .72rem; letter-spacing: .14em;
             text-transform: uppercase; color: var(--accent); margin: 0 0 .4rem; }
  .eyebrow a { color: var(--accent); }
  h1 { font-family: var(--disp); font-weight: 600; font-size: clamp(1.7rem, 4vw, 2.4rem);
       margin: 0 0 .3rem; text-wrap: balance; }
  h2 { font-family: var(--disp); font-weight: 600; font-size: 1.25rem; margin: 2.4rem 0 .9rem; }
  .sub { color: var(--ink-2); max-width: 66ch; margin: 0 0 1.4rem; }
  /* Посилання: синій на цьому фоні читався погано (Іван 31.07) —
     переводимо на акцентний, він однаково живий і в темній темі. */
  a { color: var(--accent); text-underline-offset: .15em; }
  a:hover { color: var(--ink); }
  .pill { display: inline-block; font-family: var(--mono); font-size: .7rem;
          padding: .15rem .6rem; border-radius: 999px; white-space: nowrap;
          vertical-align: middle; margin-left: .5rem; }
  .pill.design-ready, .pill.done, .pill.have, .pill.delivered, .pill.received
    { background: var(--good-bg); color: var(--good); }
  .pill.in-design, .pill.build, .pill.doing, .pill.waiting, .pill.add, .pill.ordered, .pill.shipped
    { background: var(--warn-bg); color: var(--warn); }
  .pill.concept, .pill.todo, .pill.tbd
    { background: var(--bg); color: var(--ink-2); border: 1px solid var(--line); }
  table { border-collapse: collapse; width: 100%; font-size: .84rem; }
  .tbl-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  th, td { text-align: left; padding: .5rem .8rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-family: var(--mono); font-size: .68rem; letter-spacing: .1em;
       text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
  td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  td.pic { width: 62px; padding: .35rem .4rem .35rem .8rem; }
  td.pic img { width: 54px; height: 54px; object-fit: contain; border-radius: 6px;
               background: #fff; border: 1px solid var(--line); display: block; }
  td.pic .nopic { width: 54px; height: 54px; border-radius: 6px; border: 1px dashed var(--line);
                  display: block; }
  td.pic .nopic-t { display: flex; align-items: center; justify-content: center;
                    text-align: center; font-family: var(--mono); font-size: .58rem;
                    line-height: 1.15; color: var(--ink-2); padding: .2rem; }
  .figs { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: .9rem; }
  .fig { background: #fcfcfb; border: 1px solid var(--line); border-radius: 6px; padding: .7rem; }
  .fig img { display: block; width: 100%; height: auto; border-radius: 3px; }
  .fig p { margin: .5rem 0 0; font-size: .8rem; color: var(--ink-2); }
  .decision { border-left: 3px solid var(--good); background: var(--panel);
              border-radius: 0 5px 5px 0; padding: .8rem 1rem; margin-bottom: .8rem; }
  .decision h3 { margin: 0 0 .25rem; font-size: .95rem; font-weight: 650; }
  .decision p { margin: 0; font-size: .88rem; color: var(--ink-2); max-width: 78ch; }
  .decision .why { font-family: var(--mono); font-size: .68rem; letter-spacing: .1em;
                   text-transform: uppercase; color: var(--good); }
  .empty { background: var(--panel); border: 1px dashed var(--line); border-radius: 6px;
           padding: 1rem 1.2rem; font-size: .88rem; color: var(--ink-2); }
  .gen { font-size: .75rem; color: var(--ink-2); margin-top: 2.2rem; }
</style>

<div class="wrap">
  <p class="eyebrow"><a href="https://hero-armor.github.io/">← огляд проєкту</a> · {{KEY}}</p>
  <h1>{{EMOJI}} {{LABEL}}<span class="pill {{STATUS}}">{{STATUS_LABEL}}</span></h1>
  <p class="sub">{{SUMMARY}}</p>
{{LINKS}}

{{SECTIONS}}

  <p class="gen">Дані: <span style="font-family:var(--mono)">data/*.json</span> (тег
  <span style="font-family:var(--mono)">{{KEY}}</span>) · згенеровано {{GEN_DATE}} ·
  <a href="https://hero-armor.com/">hero-armor.com</a></p>
</div>
