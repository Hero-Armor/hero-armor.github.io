<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="980" viewBox="0 0 1460 980">
<rect width="1460" height="980" fill="#ffffff"/>
<text x="40.0" y="34.0" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#1b1b1b" text-anchor="start" font-weight="700">Ящик з фігурою: пікап Богдана чи причіп</text>
<text x="40.0" y="56.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">Причіп-дім відпав — Богдан дає свій пікап. Питання тепер одне: чи влазить ящик у кузов. Усі кузови міряються проти РОЗРАХОВАНОГО ящика, а не навпаки.</text>
<text x="40.0" y="74.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">Ящик = фігура 79×47.7×13″ + поролон 2″ з кожного боку + фанера 0.75 ″ стінки.</text>
<text x="40.0" y="110.0" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="700">ДВА ВАРІАНТИ ЯЩИКА</text>
<text x="56.0" y="134.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="600">· Труба в плечах ЗНЯТА або вкорочена</text>
<text x="56.0" y="150.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">84.5″ × 53.2″ × 18.5″   (7.0 × 4.4 × 1.5 фута) — везеться окремо вздовж ящика — вона просто труба</text>
<text x="56.0" y="180.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="600">· Труба лишається в плечах</text>
<text x="56.0" y="196.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">84.5″ × 65.7″ × 18.5″   (7.0 × 5.5 × 1.5 фута) — ширина зростає на 12″ і вбиває половину варіантів</text>
<text x="40.0" y="230.0" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="700">ЩО КУДИ ВЛАЗИТЬ</text>
<text x="40.0" y="252.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="700">кузов</text>
<text x="300.0" y="252.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="700">довжина</text>
<text x="395.0" y="252.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="700">між/поверх арок</text>
<text x="520.0" y="252.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="700">борт</text>
<text x="600.0" y="252.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="700">ящик без труби</text>
<text x="800.0" y="252.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="700">ящик із трубою</text>
<text x="40.0" y="274.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="400">Пікап, короткий кузов 5.5 фута</text>
<text x="300.0" y="274.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">66″</text>
<text x="395.0" y="274.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">50/64″</text>
<text x="520.0" y="274.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">21″</text>
<text x="600.0" y="274.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#c2660a" text-anchor="start" font-weight="600">тільки з відкинутим бортом</text>
<text x="800.0" y="274.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#d81f1f" text-anchor="start" font-weight="600">ні — ширина +2″</text>
<text x="40.0" y="300.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="400">Пікап, стандарт 6.5 фута</text>
<text x="300.0" y="300.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">78″</text>
<text x="395.0" y="300.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">50/64″</text>
<text x="520.0" y="300.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">21″</text>
<text x="600.0" y="300.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#c2660a" text-anchor="start" font-weight="600">тільки з відкинутим бортом</text>
<text x="800.0" y="300.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#d81f1f" text-anchor="start" font-weight="600">ні — ширина +2″</text>
<text x="40.0" y="326.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="400">Пікап, довгий кузов 8 футів</text>
<text x="300.0" y="326.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">96″</text>
<text x="395.0" y="326.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">50/64″</text>
<text x="520.0" y="326.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">21″</text>
<text x="600.0" y="326.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#0b8a3e" text-anchor="start" font-weight="600">так</text>
<text x="800.0" y="326.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#d81f1f" text-anchor="start" font-weight="600">ні — ширина +2″</text>
<text x="40.0" y="352.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="400">Nissan Frontier 2022 Crew Cab (Turo, Hayward)</text>
<text x="300.0" y="352.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">60″</text>
<text x="395.0" y="352.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">44/61″</text>
<text x="520.0" y="352.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">19″</text>
<text x="600.0" y="352.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#d81f1f" text-anchor="start" font-weight="600">ні — довжина +25″</text>
<text x="800.0" y="352.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#d81f1f" text-anchor="start" font-weight="600">ні — довжина +25″, ширина +4″</text>
<text x="40.0" y="378.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="400">Причіп 5×8 (U-Haul)</text>
<text x="300.0" y="378.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">96″</text>
<text x="395.0" y="378.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">60/60″</text>
<text x="520.0" y="378.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">—</text>
<text x="600.0" y="378.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#0b8a3e" text-anchor="start" font-weight="600">так</text>
<text x="800.0" y="378.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#d81f1f" text-anchor="start" font-weight="600">ні — ширина +6″</text>
<text x="40.0" y="404.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="400">Причіп 6×12</text>
<text x="300.0" y="404.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">144″</text>
<text x="395.0" y="404.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">72/72″</text>
<text x="520.0" y="404.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">—</text>
<text x="600.0" y="404.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#0b8a3e" text-anchor="start" font-weight="600">так</text>
<text x="800.0" y="404.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#0b8a3e" text-anchor="start" font-weight="600">так</text>
<text x="40.0" y="420.0" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="700">ЯК ЦЕ ВИГЛЯДАЄ: стандартний кузов 6.5 фута, вид згори</text>
<rect x="60.0" y="444.0" width="234.0" height="180.0" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
<text x="177.0" y="438.0" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#555" text-anchor="middle" font-weight="400">платформа 78″</text>
<rect x="120.0" y="444.0" width="84.0" height="15.0" fill="#eceff4" stroke="#a0a0a0" stroke-width="1"/>
<rect x="120.0" y="609.0" width="84.0" height="15.0" fill="#eceff4" stroke="#a0a0a0" stroke-width="1"/>
<text x="162.0" y="455.5" font-family="Arial,Helvetica,sans-serif" font-size="8.5" fill="#a0a0a0" text-anchor="middle" font-weight="400">арка</text>
<rect x="294.0" y="444.0" width="60.0" height="180.0" fill="#f7f2ea" stroke="#c2660a" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="324.0" y="538.0" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#c2660a" text-anchor="middle" font-weight="400">борт</text>
<rect x="62.0" y="454.2" width="253.5" height="159.6" fill="#ffe9c9" stroke="#c2660a" stroke-width="1.8"/>
<text x="186.8" y="538.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#c2660a" text-anchor="middle" font-weight="700">ЯЩИК 84″ × 53″</text>
<text x="60.0" y="646.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">Ящик довший за платформу на 6″ — їде з відкинутим бортом, спертий на нього. Це законно, але кінець треба позначити червоним прапорцем.</text>
<text x="60.0" y="664.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">Ширина 53″ більша за відстань між арками (50″) — ящик лягає ЗВЕРХУ на арки, а не між ними. Значить, потрібні бруски-підкладки, щоб він не спирався на пластик арки.</text>
<text x="40.0" y="760.0" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="700">ЩО З ЦЬОГО ВИПЛИВАЄ</text>
<text x="40.0" y="784.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#c2660a" text-anchor="start" font-weight="600">· Труба в плечах вирішує все. Без неї ящик 53″ завширшки і влазить у будь-який пікап; з нею 66″ — ширше за причіп 5×8.</text>
<text x="40.0" y="804.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="400">· У пікапі Богдана ящик поїде з ВІДКИНУТИМ бортом у будь-якому разі, крім довгого кузова 8 футів. Це нормально для 300 миль по трасі, але вантаж треба стягнути так, щоб він не рухався взагалі: ящик спирається на борт, а не тримається ним.</text>
<text x="40.0" y="824.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0b8a3e" text-anchor="start" font-weight="600">· Причіп 5×8 бере ящик цілком і всередину, без звисання — але тільки якщо труба знята.</text>
<text x="40.0" y="844.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#d81f1f" text-anchor="start" font-weight="600">· Подіум у пікап РАЗОМ із ящиком не влізе. Або два рейси, або причіп 6×12 на все одразу.</text>
<text x="40.0" y="864.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="400">· Повернення тепер у Ріно, а не в SF — це міняє і пробіг, і те, куди Богдан жене машину назад. Порахувати треба обидва плеча, не тільки дорогу туди.</text>
</svg>
