<text x="40.0" y="34.0" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#1b1b1b" text-anchor="start" font-weight="700">Причіп у похідному положенні — слайд зсунутий</text>
<text x="40.0" y="56.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">Заводського плану зі зсунутим слайдом НЕ ІСНУЄ: Keystone публікує тільки розсунутий і кількість слайдів, а глибину висування не дає ніде. Тому три варіанти поруч — 24, 30 і 36 дюймів.</text>
<text x="40.0" y="74.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">Орієнтація та сама, що на заводському кресленні: ніс праворуч. Синім — дінет і диван, які в похідному положенні заїжджають усередину і забирають прохід.</text>
<text x="70.0" y="138.0" font-family="Arial,Helvetica,sans-serif" font-size="12.5" fill="#1b1b1b" text-anchor="start" font-weight="700">слайд заходить на 24″</text>
