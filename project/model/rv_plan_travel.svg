<text x="40.0" y="1056.8" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1b1b1b" text-anchor="start" font-weight="700">ЩО З ЦЬОГО ВИПЛИВАЄ</text>
<text x="40.0" y="1080.8" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0b8a3e" text-anchor="start" font-weight="600">· Фігуру везуть НА БОЦІ. Тоді їй треба смуга 13″ завширшки, а не 47.7″ — і вона проходить у всіх трьох випадках.</text>
<text x="40.0" y="1100.8" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="400">· Місця по довжині вистачає з запасом: вільна зона між спальнею і ліжками близько 154″ проти 79″ фігури.</text>
<text x="40.0" y="1120.8" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#d81f1f" text-anchor="start" font-weight="600">· На нижнє ліжко фігура НЕ ляже: полиця 74″, фігура 79″ — не вистачає пʼяти дюймів. Тільки підлога.</text>
<text x="40.0" y="1140.8" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="400">· Слайд не можна везти висунутим — ні на трасі, ні на плайї. Тому всі розрахунки перевезення робимо тільки по цій схемі, а не по заводській.</text>
<text x="40.0" y="1160.8" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#c2660a" text-anchor="start" font-weight="600">· ОДИН ЗАМІР ЗАКРИВАЄ ПИТАННЯ: ширина проходу між кухонним рядом і зсунутим дінетом. Рулетка в Богдана, тридцять секунд — і три варіанти стають одним.</text>
