<text x="118.0" y="603.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="700">Що з цього видно:</text>
<text x="118.0" y="621.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6b6b6b" text-anchor="start" font-weight="400">· у плечах фігура 26″ проти подіуму 48″ — там вільно по 11″ з боку, це найвужче місце;</text>
<text x="118.0" y="637.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6b6b6b" text-anchor="start" font-weight="400">· уздовж ніг фігура 18″ — вільна смуга 15″ з КОЖНОГО боку на всю довжину ніг;</text>
<text x="118.0" y="653.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#6b6b6b" text-anchor="start" font-weight="400">· за стопами лишається 17″ на всю ширину;</text>
<text x="118.0" y="669.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0b6b3a" text-anchor="start" font-weight="400">· станція EcoFlow 24.1″×12.9″ у бічну кишеню заходить — саме це знімає зауваження «станція не влізе».</text>
