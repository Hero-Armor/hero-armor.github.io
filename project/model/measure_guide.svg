<text x="926.5" y="376.8" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#d81f1f" text-anchor="middle" font-weight="700">M3 · глибина</text>
<text x="926.5" y="402.8" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle" font-weight="400">каркас 8.6″ + обшивка</text>
<text x="40.0" y="788.0" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="700">Як міряти</text>
<text x="40.0" y="810.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#d81f1f" text-anchor="start" font-weight="700">M1</text>
<text x="72.0" y="810.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="600">від кисті до кисті</text>
<text x="230.0" y="810.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#555" text-anchor="start" font-weight="400">Найширше місце фігури. Стрічку натягнути по прямій між крайніми точками кистей, не по дузі рук.</text>
<text x="40.0" y="829.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#d81f1f" text-anchor="start" font-weight="700">M2</text>
<text x="72.0" y="829.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="600">труба в плечах</text>
<text x="230.0" y="829.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#555" text-anchor="start" font-weight="400">Повна довжина, від торця до торця. Заодно — на скільки вона виступає за кисті: це те, що можна відрізати.</text>
<text x="40.0" y="848.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#d81f1f" text-anchor="start" font-weight="700">M3</text>
<text x="72.0" y="848.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="600">глибина</text>
<text x="230.0" y="848.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#555" text-anchor="start" font-weight="400">У найтовщому місці, від грудей до найдальшої точки ЗЗАДУ. Ядро на спині рахується — воно й може бути тією точкою.</text>
<text x="40.0" y="867.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#d81f1f" text-anchor="start" font-weight="700">M4</text>
<text x="72.0" y="867.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="600">висота</text>
<text x="230.0" y="867.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#555" text-anchor="start" font-weight="400">Від низу бази до маківки, фігура стоїть.</text>
<text x="40.0" y="886.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#d81f1f" text-anchor="start" font-weight="700">M5</text>
<text x="72.0" y="886.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="600">діаметр бази</text>
<text x="230.0" y="886.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#555" text-anchor="start" font-weight="400">Диск під ногами, по крайніх точках.</text>
<text x="40.0" y="905.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#d81f1f" text-anchor="start" font-weight="700">M6</text>
<text x="72.0" y="905.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="600">розмах ніг унизу</text>
<text x="230.0" y="905.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#555" text-anchor="start" font-weight="400">По зовнішніх краях стоп.</text>
<text x="40.0" y="942.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#1b1b1b" text-anchor="start" font-weight="600">Головне: якщо M1 з обшивкою вийде більше 49″ — мінівен відпадає і веземо причепом. Менше — заходить, але без ящика, у ковдрах.</text>
</svg>
