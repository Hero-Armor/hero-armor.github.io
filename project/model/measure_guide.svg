<text x="283.6" y="684.8" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#d81f1f" text-anchor="middle" font-weight="700">M5 · діаметр бази</text>
<text x="283.6" y="710.8" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle" font-weight="400">креслення 27.2″</text>
<line x1="146.4" y1="142.0" x2="146.4" y2="709.6" stroke="#d81f1f" stroke-width="1.4" stroke-dasharray="8 5"/>
<line x1="420.8" y1="142.0" x2="420.8" y2="709.6" stroke="#d81f1f" stroke-width="1.4" stroke-dasharray="8 5"/>
<text x="283.6" y="134.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#d81f1f" text-anchor="middle" font-weight="700">вантажний отвір мінівена 49″ — фігура має пройти між цими лініями</text>
