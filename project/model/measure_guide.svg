<text x="283.6" y="626.8" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle" font-weight="400">креслення 31.5″</text>
<line x1="207.4" y1="692.8" x2="359.7" y2="692.8" stroke="#d81f1f" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
