<text x="507.1" y="421.2" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#d81f1f" text-anchor="start" font-weight="700">M4 · висота</text>
<text x="507.1" y="436.2" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9a9a9a" text-anchor="start" font-weight="400">креслення 79.0″</text>
