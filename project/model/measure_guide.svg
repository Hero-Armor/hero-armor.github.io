<text x="40.0" y="38.0" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#1b1b1b" text-anchor="start" font-weight="700">Що міряти на ГОТОВІЙ фігурі</text>
<text x="40.0" y="60.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#555" text-anchor="start" font-weight="400">Рулетку тягнути по зібраній фігурі з обшивкою, а не по каркасу. Сірим — що дає креслення; якщо збіглось, добре.</text>
