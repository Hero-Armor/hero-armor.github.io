<text x="283.6" y="158.0" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#0b8a3e" text-anchor="middle" font-weight="700">M2 · труба в плечах, повна довжина</text>
<text x="283.6" y="184.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9a9a9a" text-anchor="middle" font-weight="400">креслення 60.2″</text>
