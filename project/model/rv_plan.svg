<text x="766.8" y="481.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#d81f1f" text-anchor="middle" font-weight="700">ГОЛОВНІ двері</text>
<text x="766.8" y="495.6" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#d81f1f" text-anchor="middle" font-weight="400">26″ × 74″</text>
<text x="766.8" y="509.6" font-family="Arial,Helvetica,sans-serif" font-size="9.5" fill="#555" text-anchor="middle" font-weight="400">праворуч спальня, ліворуч острівець</text>
<rect x="319.6" y="454.6" width="67.6" height="6" fill="#c2660a"/>
<text x="353.4" y="481.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#c2660a" text-anchor="middle" font-weight="700">ЗАДНІ двері — у ліжка</text>
<text x="353.4" y="495.6" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#c2660a" text-anchor="middle" font-weight="400">розмір заміряти</text>
