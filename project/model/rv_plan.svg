<text x="547.1" y="105.2" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#d81f1f" text-anchor="middle" font-weight="700">30 ft 7 in = 367″ — повна довжина</text>
<line x1="1128.2" y1="210.0" x2="1128.2" y2="459.6" stroke="#d81f1f" stroke-width="1.4" marker-start="url(#ad81f1f)" marker-end="url(#ad81f1f)"/>
<text x="1135.2" y="338.8" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#d81f1f" text-anchor="start" font-weight="700">8 ft = 96″</text>
<line x1="805.8" y1="527.2" x2="1024.2" y2="527.2" stroke="#d81f1f" stroke-width="1.4" marker-start="url(#ad81f1f)" marker-end="url(#ad81f1f)"/>
<text x="915.0" y="541.2" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#d81f1f" text-anchor="middle" font-weight="700">84″ — спальня</text>
<line x1="70.0" y1="173.6" x2="319.6" y2="173.6" stroke="#c2660a" stroke-width="1.4" marker-start="url(#ac2660a)" marker-end="url(#ac2660a)"/>
<text x="194.8" y="167.6" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#c2660a" text-anchor="middle" font-weight="700">≈96″ — задня зона з ліжками</text>
<text x="40.0" y="583.6" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="700">Фігура в тому ж масштабі і що саме бачать двері</text>
<rect x="70.0" y="609.6" width="205.4" height="124.0" fill="#1f4fd8" fill-opacity="0.12" stroke="#1f4fd8" stroke-width="1.6"/>
<text x="172.7" y="675.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1f4fd8" text-anchor="middle" font-weight="600">фігура згори: 79″ × 47.7″</text>
<line x1="70.0" y1="755.6" x2="275.4" y2="755.6" stroke="#1f4fd8" stroke-width="1.4" marker-start="url(#a1f4fd8)" marker-end="url(#a1f4fd8)"/>
<text x="172.7" y="769.6" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#1f4fd8" text-anchor="middle" font-weight="700">79″</text>
<text x="385.4" y="601.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="700">переріз у дверях, якщо нести НА БОЦІ:</text>
<rect x="385.4" y="615.6" width="67.6" height="192.4" fill="none" stroke="#d81f1f" stroke-width="2"/>
<text x="419.2" y="822.0" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#d81f1f" text-anchor="middle" font-weight="400">двері 26 × 74″</text>
<rect x="402.3" y="633.5" width="33.8" height="156.5" fill="#0b8a3e" fill-opacity="0.3" stroke="#0b8a3e" stroke-width="1.6"/>
<text x="469.0" y="633.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0b8a3e" text-anchor="start" font-weight="400">глибина 13″ проти 26″ — запас 13″</text>
<text x="469.0" y="653.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0b8a3e" text-anchor="start" font-weight="400">труба в плечах 60.2″ проти 74″ — запас 13.8″</text>
<text x="469.0" y="673.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0b8a3e" text-anchor="start" font-weight="400">без труби 47.7″ — запас 26.3″</text>
<text x="469.0" y="709.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="700">Вузьке місце — не двері.</text>
<text x="469.0" y="729.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#c2660a" text-anchor="start" font-weight="400">Задні двері ведуть просто до ліжок — повз кухню нести не треба.</text>
<text x="469.0" y="747.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="700">КУДИ КЛАСТИ — довжина поверхні проти 79″ фігури:</text>
<text x="469.0" y="767.6" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#0b8a3e" text-anchor="start" font-weight="600">+ ліжко queen 60 × 80″</text>
<text x="659.0" y="767.6" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="400">влазить, але веде вузький прохід і ТБ посередині</text>
<text x="469.0" y="786.6" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#d81f1f" text-anchor="start" font-weight="600">− двоярусні ліжка 51 × 74″</text>
<text x="659.0" y="786.6" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="400">коротше на 5″ — звисатиме</text>
<text x="469.0" y="805.6" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#c2660a" text-anchor="start" font-weight="600">? розкладений диван</text>
<text x="659.0" y="805.6" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="400">у відкритих даних нема, типово 68-72″ — заміряти</text>
<text x="469.0" y="824.6" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#c2660a" text-anchor="start" font-weight="600">? дінет, розкладений у ліжко</text>
<text x="659.0" y="824.6" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="400">у відкритих даних нема, типово 68-74″ — заміряти</text>
<text x="469.0" y="857.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="700">Але внутрішня ширина причепа ≈ 90″ — фігура вільно лягає ПОПЕРЕК,</text>
<text x="469.0" y="875.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="400">від дивана до протилежної стінки. Тоді довжина поверхні взагалі не важлива.</text>
<text x="469.0" y="901.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#c2660a" text-anchor="start" font-weight="700">ЩО ЗАМІРЯТИ В БОГДАНА:</text>
<text x="469.0" y="921.6" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">· розмір ЗАДНІХ дверей</text>
<text x="469.0" y="939.6" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">· ширину внутрішніх дверей у спальню</text>
<text x="469.0" y="957.6" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">· довжину розкладеного дивана і дінета</text>
<text x="469.0" y="975.6" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">· висоту порога над землею</text>
<text x="469.0" y="993.6" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">· ширину проходу в найвужчому місці</text>
</svg>
