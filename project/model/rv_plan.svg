<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d81f1f" stroke-width="1.4"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#d81f1f" stroke-width="1.4"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#c2660a" stroke-width="1.4"/></marker></defs>
<rect width="1180" height="900" fill="#ffffff"/>
<text x="40.0" y="36.0" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#1b1b1b" text-anchor="start" font-weight="700">Причіп Богдана згори — Keystone Passport SL 268BH</text>
<text x="40.0" y="58.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">30 ft 7 in × 8 ft. Планування з опублікованого плану 268BH; меблі показані приблизно, щоб було видно прохід. Розміри головних дверей — з сайта Keystone.</text>
<text x="40.0" y="76.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">Ніс причепа ліворуч, задок праворуч. Двері — на правому по ходу боці (на схемі знизу).</text>
<rect x="60.0" y="200.0" width="954.2" height="249.6" rx="20.8" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
<path d="M60.0 314.4 L-7.6 324.8 L60.0 335.2 Z" fill="none" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="-13.6" y="328.8" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#555" text-anchor="end" font-weight="400">зчіп</text>
<rect x="67.8" y="207.8" width="208.0" height="234.0" fill="#eef3ff" stroke="#9db4e8" stroke-width="1.2"/>
<text x="171.8" y="327.8" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#555" text-anchor="middle" font-weight="400">спальня: ліжко queen</text>
<text x="171.8" y="339.8" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#a0a0a0" text-anchor="middle" font-weight="400">80″ уздовж</text>
<rect x="275.8" y="207.8" width="88.4" height="98.8" fill="#f7f2ea" stroke="#cbbba2" stroke-width="1.2"/>
<text x="320.0" y="260.2" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#555" text-anchor="middle" font-weight="400">санвузол</text>
<rect x="275.8" y="306.6" width="88.4" height="135.2" fill="#f7f2ea" stroke="#cbbba2" stroke-width="1.2"/>
<text x="320.0" y="377.2" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#555" text-anchor="middle" font-weight="400">шафа</text>
<rect x="374.6" y="207.8" width="312.0" height="67.6" fill="#f2f7f0" stroke="#a9c6a1" stroke-width="1.2"/>
<text x="530.6" y="244.6" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#555" text-anchor="middle" font-weight="400">кухня</text>
<rect x="395.4" y="127.2" width="286.0" height="74.8" fill="#f6f6ff" stroke="#1f4fd8" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="538.4" y="167.6" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#1f4fd8" text-anchor="middle" font-weight="400">слайд-аут (дінет)</text>
<rect x="374.6" y="280.6" width="312.0" height="161.2" fill="#0b8a3e" fill-opacity="0.08" stroke="#0b8a3e" stroke-width="1" stroke-dasharray="5 4"/>
<text x="530.6" y="365.2" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#0b8a3e" text-anchor="middle" font-weight="400">прохід ≈ 30-36″</text>
<rect x="686.6" y="207.8" width="319.8" height="234.0" fill="#fff4ee" stroke="#e0b49a" stroke-width="1.2"/>
<text x="846.5" y="327.8" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#555" text-anchor="middle" font-weight="400">двоярусні ліжка</text>
<text x="846.5" y="339.8" font-family="Arial,Helvetica,sans-serif" font-size="9" fill="#a0a0a0" text-anchor="middle" font-weight="400">сюди веде задні двері</text>
<rect x="457.8" y="444.6" width="67.6" height="6" fill="#d81f1f"/>
<text x="491.6" y="473.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#d81f1f" text-anchor="middle" font-weight="700">головні двері</text>
<text x="491.6" y="487.6" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#d81f1f" text-anchor="middle" font-weight="400">26″ × 74″ (Keystone)</text>
<rect x="775.0" y="444.6" width="67.6" height="6" fill="#c2660a"/>
<text x="808.8" y="473.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#c2660a" text-anchor="middle" font-weight="700">задні двері в зону ліжок</text>
<text x="808.8" y="487.6" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#c2660a" text-anchor="middle" font-weight="400">ширина не опублікована — заміряти</text>
<path d="M808.8 489.2 L808.8 311.8" stroke="#c2660a" stroke-width="2.4" fill="none" marker-end="url(#o)" stroke-dasharray="9 5"/>
<path d="M491.6 489.2 L491.6 361.2" stroke="#d81f1f" stroke-width="2" fill="none" marker-end="url(#r)" stroke-dasharray="9 5"/>
<line x1="60.0" y1="111.6" x2="1014.2" y2="111.6" stroke="#d81f1f" stroke-width="1.4" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="537.1" y="105.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#d81f1f" text-anchor="middle" font-weight="700">30.6 ft (367″) — довжина</text>
<text x="40.0" y="569.6" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#1b1b1b" text-anchor="start" font-weight="700">Фігура в тому ж масштабі і що саме бачать двері</text>
<rect x="60.0" y="599.6" width="205.4" height="124.0" fill="#1f4fd8" fill-opacity="0.12" stroke="#1f4fd8" stroke-width="1.6"/>
<text x="162.7" y="665.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1f4fd8" text-anchor="middle" font-weight="600">фігура згори: 79″ × 48″</text>
<text x="355.4" y="591.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="700">переріз у дверях, якщо нести НА БОЦІ:</text>
<rect x="355.4" y="605.6" width="67.6" height="192.4" fill="none" stroke="#d81f1f" stroke-width="2"/>
<text x="389.2" y="814.0" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#d81f1f" text-anchor="middle" font-weight="400">двері 26 × 74″</text>
<rect x="373.6" y="623.5" width="31.2" height="156.5" fill="#0b8a3e" fill-opacity="0.3" stroke="#0b8a3e" stroke-width="1.6"/>
<text x="437.0" y="629.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0b8a3e" text-anchor="start" font-weight="400">глибина 12″ проти 26″ — запас 14″</text>
<text x="437.0" y="649.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0b8a3e" text-anchor="start" font-weight="400">труба в плечах 60.2″ проти 74″ — запас 13.8″</text>
<text x="437.0" y="669.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0b8a3e" text-anchor="start" font-weight="400">без труби 47.7″ — запас 26.3″</text>
<text x="437.0" y="695.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="700">Тобто вузьке місце — не двері.</text>
<text x="437.0" y="713.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">Вузьке місце — поріг на 26-30″ над землею</text>
<text x="437.0" y="729.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">і прохід усередині.</text>
<text x="437.0" y="751.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#c2660a" text-anchor="start" font-weight="400">Задні двері ведуть одразу до ліжок —</text>
<text x="437.0" y="767.6" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#c2660a" text-anchor="start" font-weight="400">нести повз кухню не треба.</text>
</svg>
