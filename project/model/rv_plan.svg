<rect x="77.8" y="217.8" width="119.6" height="114.4" fill="#f7f2ea" stroke="#cbbba2" stroke-width="1.2"/>
<text x="137.6" y="275.0" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#555" text-anchor="middle" font-weight="400">душ і санвузол</text>
