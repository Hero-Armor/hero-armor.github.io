<rect width="1240" height="1060" fill="#ffffff"/>
<text x="40.0" y="34.0" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#1b1b1b" text-anchor="start" font-weight="700">Причіп Богдана — розміри поверх заводського плану</text>
<text x="40.0" y="56.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">Keystone Passport SL 268BH. Орієнтація та сама, що на заводському кресленні вище: ніс і зчіп ПРАВОРУЧ, обидві двері знизу.</text>
<text x="40.0" y="74.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#555" text-anchor="start" font-weight="400">Червоним — розміри із заводських даних. Жовтим — те, чого у відкритих даних нема і що треба зняти рулеткою в Богдана.</text>
<rect x="70.0" y="210.0" width="954.2" height="249.6" rx="20.8" fill="#ffffff" stroke="#1b1b1b" stroke-width="2"/>
<path d="M1024.2 324.4 L1091.8 334.8 L1024.2 345.2 Z" fill="none" stroke="#1b1b1b" stroke-width="1.6"/>
<text x="1034.6" y="194.4" font-family="Arial,Helvetica,sans-serif" font-size="10" fill="#555" text-anchor="start" font-weight="400">зчіп, ніс →</text>
