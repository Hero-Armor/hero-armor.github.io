<text x="30.0" y="280.0" font-size="11" fill="#6b675c" text-anchor="start">Кут падіння = куту відбиття: промінь іде</text>
<text x="30.0" y="294.0" font-size="11" fill="#6b675c" text-anchor="start">далі, повз того, хто світив.</text>
