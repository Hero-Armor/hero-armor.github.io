<text x="920.0" y="586.0" font-size="11" fill="#6b675c" text-anchor="middle">500</text>
<text x="30.0" y="604.0" font-size="11" fill="#6b675c" text-anchor="start">лінійка дальності: рівні кроки — це множення, інакше 45 м і 400 м не влізли б в один рядок</text>
<text x="30.0" y="620.0" font-size="11" fill="#6b675c" text-anchor="start">мікропризма повертає вдесятеро більше світла за стрічку на скляній крихті, і луговий пил з неї протирається — з крихти вже ні</text>
<line x1="30.0" y1="641.0" x2="54.0" y2="641.0" stroke="#b07c14" stroke-width="2.0"/>
