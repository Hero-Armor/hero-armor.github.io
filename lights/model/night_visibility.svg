<text x="480.0" y="24.0" font-size="14" fill="#24231d" text-anchor="middle">Пасивна помітність: чому призма повертає промінь, а фарба — ні</text>
<text x="480.0" y="42.0" font-size="11" fill="#6b675c" text-anchor="middle">Правило Burning Man: обʼєкт має бути видно за 150 футів ≈ 45 м. Це виконує активне світло — 24 врізних вогні торця і 2 маркери ящика.</text>
<text x="480.0" y="58.0" font-size="11" fill="#6b675c" text-anchor="middle">Катафоти і стрічка самі не світять: вони повертають чужу фару, тому активне світло не заміняють.</text>
<text x="30.0" y="88.0" font-size="12" fill="#24231d" text-anchor="start">1 · Що поверхня робить з променем фари</text>
<circle cx="126.0" cy="100.0" r="7" fill="#fff" stroke="#24231d" stroke-width="1.6"/>
