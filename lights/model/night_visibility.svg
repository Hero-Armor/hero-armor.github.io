<text x="340.0" y="280.0" font-size="11" fill="#6b675c" text-anchor="start">Розкидає світло навсібіч. Назад іде</text>
<text x="340.0" y="294.0" font-size="11" fill="#6b675c" text-anchor="start">дрібка — тому біле не видно здалеку.</text>
