<text x="477.1" y="452.0" font-size="11" fill="#3d6f96" text-anchor="middle">45 м — правило Burning Man</text>
<rect x="530.0" y="459.0" width="127.5" height="11" rx="2" fill="#b35b1e" stroke="#b35b1e" stroke-width="1.5"/>
