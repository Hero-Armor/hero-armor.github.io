<text x="790.0" y="262.0" font-size="12" fill="#24231d" text-anchor="middle" font-weight="600">Мікропризма (кутовий відбивач)</text>
<text x="650.0" y="280.0" font-size="11" fill="#6b675c" text-anchor="start">Два дзеркала під прямим кутом: промінь</text>
<text x="650.0" y="294.0" font-size="11" fill="#6b675c" text-anchor="start">вертається точно у фару, а не вбік.</text>
<text x="30.0" y="314.0" font-size="12" fill="#24231d" text-anchor="start">2 · З якої відстані що видно вночі</text>
