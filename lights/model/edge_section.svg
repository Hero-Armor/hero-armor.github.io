<text x="578.0" y="364.0" font-size="12" fill="#b07c14" text-anchor="start" font-weight="600">Відкрите питання</text>
<text x="578.0" y="386.0" font-size="11" fill="#6b675c" text-anchor="start">Розсвердлити накладку з Ø22 до Ø25 —</text>
<text x="578.0" y="402.0" font-size="11" fill="#6b675c" text-anchor="start">фланець Ø32 накриє отвір з полем 3.5 мм.</text>
<text x="578.0" y="424.0" font-size="11" fill="#6b675c" text-anchor="start">Або шукати вогник під Ø22: вибір вужчий</text>
<text x="578.0" y="440.0" font-size="11" fill="#6b675c" text-anchor="start">і дорожчий за штуку.</text>
<text x="578.0" y="462.0" font-size="11" fill="#b07c14" text-anchor="start">Володимир — чекаємо на відповідь</text>
<text x="46.0" y="486.0" font-size="11" fill="#6b675c" text-anchor="start">вогник затягується комплектною гайкою до алюмінієвої накладки торця;</text>
<text x="46.0" y="502.0" font-size="11" fill="#6b675c" text-anchor="start">прокладка під фланець і силікон зовні — щоб отвір не став входом для пилу</text>
