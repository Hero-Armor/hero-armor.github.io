<text x="316.0" y="336.0" font-size="11" fill="#6b675c" text-anchor="start">гніздо з тилу Ø50</text>
<line x1="312.0" y1="332.0" x2="228.3" y2="321.5" stroke="#d8d5c9" stroke-width="0.8"/>
<text x="316.0" y="360.0" font-size="11" fill="#6b675c" text-anchor="start">кабель у гофрі: 14 AWG, 2.5 мм²</text>
<line x1="312.0" y1="356.0" x2="288.0" y2="324.0" stroke="#d8d5c9" stroke-width="0.8"/>
<text x="316.0" y="392.0" font-size="11" fill="#6b675c" text-anchor="start">планка OSB 19 мм</text>
