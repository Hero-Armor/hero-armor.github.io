<text x="848.0" y="300.0" font-size="11" fill="#6b675c" text-anchor="middle">посадка Ø25 — плюс 3 мм</text>
<text x="848.0" y="318.0" font-size="11" fill="#b23a2e" text-anchor="middle" font-weight="600">у накладку не сідає</text>
