<text x="60.0" y="550.0" font-size="11" fill="#6b675c" text-anchor="start">пунктир — отвір за кресленням: Ø22 в накладці, Ø30 у сосні</text>
<circle cx="41" cy="568" r="7" fill="#b23a2e" stroke="#b23a2e" stroke-width="1.5"/>
<text x="60.0" y="572.0" font-size="11" fill="#6b675c" text-anchor="start">червоне — розмір ходового набору, який у цей отвір не сідає</text>
<polyline points="37.0,586.0 45.0,590.0 37.0,594.0 45.0,598.0 37.0,602.0" fill="none" stroke="#24231d" stroke-width="1.2"/>
<text x="60.0" y="594.0" font-size="11" fill="#6b675c" text-anchor="start">зиґзаґ — розріз обірвано, далі рама подіуму йде так само</text>
