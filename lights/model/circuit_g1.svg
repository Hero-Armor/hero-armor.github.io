<text x="1165" y="582" text-anchor="middle" font-size="11" fill="#b07c14" font-weight="bold">Кінець кільця</text>
<text x="1165" y="598" text-anchor="middle" font-size="9" fill="#6b675c">змикається з вводом</text>
<text x="352" y="233" text-anchor="end" font-size="9" fill="#6b675c">IN</text>
<text x="568" y="233" text-anchor="start" font-size="9" fill="#6b675c">OUT</text>
<text x="290" y="220" text-anchor="middle" font-size="9" fill="#6b675c">Ancor 12/2 AWG · 4 м</text>
<text x="630" y="220" text-anchor="middle" font-size="9" fill="#6b675c">AWG12 · 3.3 А · −3.5%</text>
<text x="40" y="340" text-anchor="start" font-size="10" fill="#6b675c">Диммер керує ШІМ-імпульсами,</text>
<text x="40" y="358" text-anchor="start" font-size="10" fill="#6b675c">а не заниженням напруги —</text>
<text x="40" y="376" text-anchor="start" font-size="10" fill="#6b675c">лампа бачить повні 12 В і не</text>
<text x="40" y="394" text-anchor="start" font-size="10" fill="#6b675c">жовтіє на малій яскравості.</text>
<text x="40" y="440" text-anchor="start" font-size="10" fill="#24231d" font-weight="bold">Відвід на кожну стійку:</text>
<text x="40" y="458" text-anchor="start" font-size="10" fill="#6b675c">16/2 AWG у гофрі, 2.5 м —</text>
<text x="40" y="476" text-anchor="start" font-size="10" fill="#6b675c">штатний хвіст світильника</text>
<text x="40" y="494" text-anchor="start" font-size="10" fill="#6b675c">плюс подовження.</text>
<text x="40" y="540" text-anchor="start" font-size="10" fill="#6b675c">Перегорів один прожектор —</text>
<text x="40" y="558" text-anchor="start" font-size="10" fill="#6b675c">решта світять: кільце не</text>
<text x="40" y="576" text-anchor="start" font-size="10" fill="#6b675c">рветься, кожен висить на</text>
<text x="40" y="594" text-anchor="start" font-size="10" fill="#6b675c">власному відводі.</text>
<line x1="40" y1="628" x2="1240" y2="628" stroke="#d8d5c9" stroke-width="1"/>
<text x="40" y="650" text-anchor="start" font-size="10" fill="#6b675c">Просадка до найдальшої стійки −3.5% при межі 5% · струм групи 3.3 А при межі диммера 30 А.</text>
<text x="40" y="666" text-anchor="start" font-size="10" fill="#6b675c">Довжина кільця 12 м (прикидка) — периметр октагона з креслення; відвід 2.5 м на стійку.</text>
<text x="40" y="682" text-anchor="start" font-size="10" fill="#6b675c">Прицілювання ~16° угору на фігуру, розкрив 60°, 4000 K — тепліше світло робило синю броню сірою.</text>
