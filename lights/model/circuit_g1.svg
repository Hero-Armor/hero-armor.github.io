<text x="640" y="30" text-anchor="middle" font-size="15" fill="#24231d" font-weight="bold">Гр.1 · прожектори заливки — кільце по периметру подіуму</text>
<text x="640" y="52" text-anchor="middle" font-size="11" fill="#6b675c">8 × 5 Вт · 40 Вт на групу · запобіжник 5 А · яскравість крутиться ШІМ-диммером</text>
<text x="640" y="72" text-anchor="middle" font-size="11" fill="#3d7a4f" font-weight="bold">Кільце замкнуте: найдальша стійка живиться з двох боків, тому крайні прожектори не тьмяніші за ближні.</text>
