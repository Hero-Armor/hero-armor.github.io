<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1010" width="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<text x="620" y="30" text-anchor="middle" font-size="15" fill="#24231d" font-weight="bold">Розводка ламп по тілу робота — куди йде кожен дріт</text>
<text x="620" y="52" text-anchor="middle" font-size="11" fill="#6b675c">8 ламп Ø12 мм + 2 лампи Ø8 мм · 0.4 Вт кожна · магістраль 18/2 AWG тонкий, у броні, 0.27 А</text>
<text x="620" y="72" text-anchor="middle" font-size="11" fill="#3d7a4f" font-weight="bold">Один кабель заходить крізь ногу, далі клемний вузол у грудях — і від нього своя пара до кожної лампи.</text>
<rect x="469" y="240" width="61" height="72" rx="12" fill="#efeee7" stroke="#24231d" stroke-width="1.4"/>
<rect x="481" y="306" width="38" height="19" fill="#efeee7" stroke="#24231d" stroke-width="1.2"/>
<path d="M388.0,325.2 L612.0,325.2 L558.9,466.0 L571.7,530.0 L428.3,530.0 L441.1,466.0 Z" fill="#efeee7" stroke="#24231d" stroke-width="1.4"/>
