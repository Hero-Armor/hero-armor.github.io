<circle cx="404" cy="492" r="4" fill="#fff" stroke="#b35b1e" stroke-width="2"/>
<path d="M500,380 L500,325 L596,325 L596,492 L596,492" fill="none" stroke="#b35b1e" stroke-width="1.5" opacity="0.85" stroke-dasharray="5,4"/>
<circle cx="596" cy="492" r="4" fill="#fff" stroke="#b35b1e" stroke-width="2"/>
<rect x="448" y="360" width="104" height="40" rx="6" fill="#fff" stroke="#b35b1e" stroke-width="2"/>
<text x="500" y="376" text-anchor="middle" font-size="10" fill="#24231d" font-weight="bold">клемний вузол</text>
<text x="500" y="391" text-anchor="middle" font-size="9" fill="#6b675c">Wago 221 у гелі</text>
<text x="800" y="150" text-anchor="start" font-size="12" fill="#24231d" font-weight="bold">Гілки від вузла</text>
<text x="800" y="168" text-anchor="start" font-size="9" fill="#6b675c">довжина — геометрична прикидка з пропорцій фігури</text>
<text x="800" y="196" text-anchor="start" font-size="10" fill="#24231d" font-weight="bold">шолом · 4× Ø12 мм</text>
<text x="800" y="211" text-anchor="start" font-size="10" fill="#6b675c">1.71 м дроту · 1.6 Вт</text>
<text x="800" y="234" text-anchor="start" font-size="10" fill="#24231d" font-weight="bold">плечі · 2× Ø12 мм</text>
<text x="800" y="249" text-anchor="start" font-size="10" fill="#6b675c">1.02 м дроту · 0.8 Вт</text>
<text x="800" y="272" text-anchor="start" font-size="10" fill="#24231d" font-weight="bold">груди · 1× Ø12 мм (місце уточнюємо)</text>
<text x="800" y="287" text-anchor="start" font-size="10" fill="#6b675c">сидить на самому вузлі · 0.4 Вт</text>
<text x="800" y="310" text-anchor="start" font-size="10" fill="#24231d" font-weight="bold">коліно · 1× Ø12 мм</text>
<text x="800" y="325" text-anchor="start" font-size="10" fill="#6b675c">1.04 м дроту · 0.4 Вт</text>
<text x="800" y="348" text-anchor="start" font-size="10" fill="#24231d" font-weight="bold">стопа · 1× Ø12 мм</text>
<text x="800" y="363" text-anchor="start" font-size="10" fill="#6b675c">1.53 м дроту · 0.4 Вт</text>
<text x="800" y="386" text-anchor="start" font-size="10" fill="#24231d" font-weight="bold">передпліччя · 2× Ø8 мм (місце уточнюємо)</text>
<text x="800" y="401" text-anchor="start" font-size="10" fill="#6b675c">1.98 м дроту · 0.8 Вт</text>
<line x1="800" y1="418" x2="1200" y2="418" stroke="#d8d5c9"/>
<text x="800" y="438" text-anchor="start" font-size="10" fill="#24231d" font-weight="bold">Магістраль у тілі: 1.59 м</text>
<text x="800" y="456" text-anchor="start" font-size="10" fill="#24231d" font-weight="bold">Усі гілки разом: 7.27 м</text>
<text x="800" y="474" text-anchor="start" font-size="10" fill="#3d7a4f" font-weight="bold">Разом дроту в костюмі ≈ 8.9 м</text>
<text x="800" y="492" text-anchor="start" font-size="9" fill="#6b675c">плюс запас на вигини і зачистку</text>
<text x="60" y="150" text-anchor="start" font-size="12" fill="#24231d" font-weight="bold">Як це читати</text>
<text x="60" y="174" text-anchor="start" font-size="10" fill="#6b675c">Товста лінія — магістральна пара: заходить</text>
<text x="60" y="190" text-anchor="start" font-size="10" fill="#6b675c">з настилу крізь ногу і піднімається до грудей.</text>
<text x="60" y="206" text-anchor="start" font-size="10" fill="#6b675c"></text>
<text x="60" y="222" text-anchor="start" font-size="10" fill="#6b675c">Тонкі лінії — гілки до окремих ламп. Кожна</text>
<text x="60" y="238" text-anchor="start" font-size="10" fill="#6b675c">лампа має СВОЮ пару від вузла, тому</text>
<text x="60" y="254" text-anchor="start" font-size="10" fill="#6b675c">перегоріла лампа не гасить сусідніх.</text>
<text x="60" y="270" text-anchor="start" font-size="10" fill="#6b675c"></text>
<text x="60" y="286" text-anchor="start" font-size="10" fill="#6b675c">Дріт іде всередині решітки корпусу —</text>
<text x="60" y="302" text-anchor="start" font-size="10" fill="#6b675c">по прямій крізь порожнечу він не піде,</text>
<text x="60" y="318" text-anchor="start" font-size="10" fill="#6b675c">тому траси намальовані ламаними.</text>
<text x="60" y="334" text-anchor="start" font-size="10" fill="#6b675c"></text>
<text x="60" y="350" text-anchor="start" font-size="10" fill="#6b675c">Пунктир — те, що ще не підтверджене</text>
<text x="60" y="366" text-anchor="start" font-size="10" fill="#6b675c">конструктором (лампа грудей видна лише</text>
<text x="60" y="382" text-anchor="start" font-size="10" fill="#6b675c">спереду, місце двох Ø8 мм уточнюємо).</text>
<line x1="40" y1="914" x2="1200" y2="914" stroke="#d8d5c9"/>
<text x="40" y="934" text-anchor="start" font-size="10" fill="#6b675c">Довжини рахуються з пропорцій фігури (висота 2.0 м над настилом) манхеттенською трасою — це прикидка на закупівлю дроту, а не розмір з креслення.</text>
<text x="40" y="952" text-anchor="start" font-size="10" fill="#6b675c">Місць на схемі 11, у специфікації 10 ламп — розбіжність усередині бази показуємо, а не ховаємо.</text>
<text x="40" y="970" text-anchor="start" font-size="10" fill="#6b675c">Електрика цього ж вузла (шини, запобіжник, паралельне підключення) — на схемі «Лампи на корпусі робота».</text>
</svg>