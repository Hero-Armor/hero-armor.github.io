<rect x="502" y="821" width="79" height="29" rx="3" fill="#e8e4d6" stroke="#24231d" stroke-width="1.2"/>
<rect x="282" y="850" width="435" height="12" fill="#e8e4d6" stroke="#24231d" stroke-width="1.2"/>
<path d="M540,850 L540,380 L500,380" fill="none" stroke="#b35b1e" stroke-width="3.4"/>
<circle cx="540" cy="850" r="6" fill="#b35b1e"/>
<text x="562" y="884" text-anchor="start" font-size="10" fill="#24231d">вхід кабелю з настилу подіуму</text>
<text x="562" y="900" text-anchor="start" font-size="9" fill="#6b675c">18/2 AWG тонкий, у броні, 6.0 м від коробки Гр.2</text>
<path d="M500,380 L500,258 L478,258" fill="none" stroke="#b35b1e" stroke-width="1.5" opacity="0.85"/>
<circle cx="478" cy="258" r="5" fill="#fff" stroke="#b35b1e" stroke-width="2"/>
<path d="M500,380 L500,258 L492,258" fill="none" stroke="#b35b1e" stroke-width="1.5" opacity="0.85"/>
<circle cx="492" cy="258" r="5" fill="#fff" stroke="#b35b1e" stroke-width="2"/>
<path d="M500,380 L500,258 L508,258" fill="none" stroke="#b35b1e" stroke-width="1.5" opacity="0.85"/>
<circle cx="508" cy="258" r="5" fill="#fff" stroke="#b35b1e" stroke-width="2"/>
<path d="M500,380 L500,258 L522,258" fill="none" stroke="#b35b1e" stroke-width="1.5" opacity="0.85"/>
<circle cx="522" cy="258" r="5" fill="#fff" stroke="#b35b1e" stroke-width="2"/>
