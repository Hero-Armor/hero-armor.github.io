<circle cx="604" cy="330" r="5" fill="#fff" stroke="#b35b1e" stroke-width="2"/>
<path d="M500,380 L500,380 L500,380" fill="none" stroke="#b35b1e" stroke-width="1.5" opacity="0.85" stroke-dasharray="5,4"/>
<circle cx="500" cy="380" r="5" fill="#fff" stroke="#b35b1e" stroke-width="2"/>
