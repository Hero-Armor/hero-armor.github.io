<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1060" width="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<text x="590" y="30" text-anchor="middle" font-size="15" fill="#24231d" font-weight="bold">Лампи на корпусі робота — кожна своєю парою від клемного вузла</text>
<text x="590" y="52" text-anchor="middle" font-size="11" fill="#6b675c">шина 12 В · група Гр.2 (декор) · 8× Ø12 мм + 2× Ø8 мм · 0.4 Вт на лампу · разом 4.4 Вт</text>
<text x="590" y="72" text-anchor="middle" font-size="11" fill="#3d7a4f" font-weight="bold">Паралельно: згасла одна лампа — решта світять. Послідовно (ланцюжком) ми не робимо.</text>
<rect x="40" y="150" width="170" height="92" rx="5" fill="#efeee7" stroke="#3d6f96" stroke-width="1.8"/>
<text x="125" y="176" text-anchor="middle" font-size="12" fill="#24231d" font-weight="bold">Коробка Гр.2</text>
<text x="125" y="194" text-anchor="middle" font-size="10" fill="#6b675c">контролер WLED</text>
<text x="125" y="210" text-anchor="middle" font-size="10" fill="#3d6f96">запобіжник 5 А</text>
<text x="125" y="226" text-anchor="middle" font-size="9" fill="#6b675c">у гермокоробці IP65</text>
<path d="M210,189 L285,189 L285,196 L346,196" fill="none" stroke="#b35b1e" stroke-width="2.6"/>
<path d="M210,203 L302,203 L302,252 L346,252" fill="none" stroke="#4a4a44" stroke-width="2.6"/>
<text x="40" y="286" text-anchor="start" font-size="11" fill="#24231d" font-weight="bold">Магістральна пара в корпус</text>
<text x="40" y="304" text-anchor="start" font-size="10" fill="#6b675c">18/2 AWG тонкий, у броні</text>
<text x="40" y="320" text-anchor="start" font-size="10" fill="#6b675c">AWG18 · 6.0 м ~ · 0.27 А · просадка −0.6%</text>
<text x="40" y="338" text-anchor="start" font-size="10" fill="#6b675c">іде всередині решітки корпусу, не по поверхні</text>
<rect x="330" y="130" width="220" height="160" rx="5" fill="#f5f4ef" stroke="#24231d" stroke-width="1.8"/>
<text x="440" y="154" text-anchor="middle" font-size="12" fill="#24231d" font-weight="bold">Клемний вузол</text>
<text x="440" y="170" text-anchor="middle" font-size="9" fill="#6b675c">Wago 221 у гелевому боксі</text>
<rect x="346" y="185" width="188" height="22" rx="3" fill="#fff" stroke="#b35b1e" stroke-width="1.6"/>
<text x="440" y="200" text-anchor="middle" font-size="10" fill="#b35b1e" font-weight="bold">+12 В</text>
<rect x="346" y="241" width="188" height="22" rx="3" fill="#fff" stroke="#4a4a44" stroke-width="1.6"/>
<text x="440" y="256" text-anchor="middle" font-size="10" fill="#4a4a44" font-weight="bold">−  (спільний)</text>
<text x="440" y="308" text-anchor="middle" font-size="9" fill="#6b675c">усередині фігури, у грудях</text>
<path d="M550,196 L590,196 L590,648" fill="none" stroke="#b35b1e" stroke-width="2.6"/>
<path d="M550,252 L616,252 L616,648" fill="none" stroke="#4a4a44" stroke-width="2.6"/>
<circle cx="590" cy="348" r="4" fill="#b35b1e"/>
<circle cx="616" cy="362" r="4" fill="#4a4a44"/>
<line x1="590" y1="348" x2="760" y2="348" stroke="#b35b1e" stroke-width="1.8"/>
<line x1="616" y1="362" x2="760" y2="362" stroke="#4a4a44" stroke-width="1.8"/>
<rect x="760" y="336" width="380" height="40" rx="4" fill="#f5f4ef" stroke="#24231d" stroke-width="1.4"/>
<text x="774" y="352" text-anchor="start" font-size="11" fill="#24231d" font-weight="bold">шолом · 4× Ø12 мм</text>
<text x="774" y="368" text-anchor="start" font-size="9" fill="#6b675c">1.6 Вт</text>
<circle cx="590" cy="408" r="4" fill="#b35b1e"/>
<circle cx="616" cy="422" r="4" fill="#4a4a44"/>
<line x1="590" y1="408" x2="760" y2="408" stroke="#b35b1e" stroke-width="1.8"/>
<line x1="616" y1="422" x2="760" y2="422" stroke="#4a4a44" stroke-width="1.8"/>
<rect x="760" y="396" width="380" height="40" rx="4" fill="#f5f4ef" stroke="#24231d" stroke-width="1.4"/>
<text x="774" y="412" text-anchor="start" font-size="11" fill="#24231d" font-weight="bold">плечі · 2× Ø12 мм</text>
<text x="774" y="428" text-anchor="start" font-size="9" fill="#6b675c">0.8 Вт</text>
<circle cx="590" cy="468" r="4" fill="#b35b1e"/>
<circle cx="616" cy="482" r="4" fill="#4a4a44"/>
<line x1="590" y1="468" x2="760" y2="468" stroke="#b35b1e" stroke-width="1.8" stroke-dasharray="5,4"/>
<line x1="616" y1="482" x2="760" y2="482" stroke="#4a4a44" stroke-width="1.8" stroke-dasharray="5,4"/>
<rect x="760" y="456" width="380" height="40" rx="4" fill="#f5f4ef" stroke="#24231d" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="774" y="472" text-anchor="start" font-size="11" fill="#24231d" font-weight="bold">груди · 1× Ø12 мм</text>
<text x="774" y="488" text-anchor="start" font-size="9" fill="#6b675c">0.4 Вт · з іншого боку фігури</text>
<circle cx="590" cy="528" r="4" fill="#b35b1e"/>
<circle cx="616" cy="542" r="4" fill="#4a4a44"/>
<line x1="590" y1="528" x2="760" y2="528" stroke="#b35b1e" stroke-width="1.8"/>
<line x1="616" y1="542" x2="760" y2="542" stroke="#4a4a44" stroke-width="1.8"/>
<rect x="760" y="516" width="380" height="40" rx="4" fill="#f5f4ef" stroke="#24231d" stroke-width="1.4"/>
<text x="774" y="532" text-anchor="start" font-size="11" fill="#24231d" font-weight="bold">коліно · 1× Ø12 мм</text>
<text x="774" y="548" text-anchor="start" font-size="9" fill="#6b675c">0.4 Вт</text>
<circle cx="590" cy="588" r="4" fill="#b35b1e"/>
<circle cx="616" cy="602" r="4" fill="#4a4a44"/>
<line x1="590" y1="588" x2="760" y2="588" stroke="#b35b1e" stroke-width="1.8"/>
<line x1="616" y1="602" x2="760" y2="602" stroke="#4a4a44" stroke-width="1.8"/>
<rect x="760" y="576" width="380" height="40" rx="4" fill="#f5f4ef" stroke="#24231d" stroke-width="1.4"/>
<text x="774" y="592" text-anchor="start" font-size="11" fill="#24231d" font-weight="bold">стопа · 1× Ø12 мм</text>
<text x="774" y="608" text-anchor="start" font-size="9" fill="#6b675c">0.4 Вт</text>
<circle cx="590" cy="648" r="4" fill="#b35b1e"/>
<circle cx="616" cy="662" r="4" fill="#4a4a44"/>
<line x1="590" y1="648" x2="760" y2="648" stroke="#b35b1e" stroke-width="1.8" stroke-dasharray="5,4"/>
<line x1="616" y1="662" x2="760" y2="662" stroke="#4a4a44" stroke-width="1.8" stroke-dasharray="5,4"/>
<rect x="760" y="636" width="380" height="40" rx="4" fill="#f5f4ef" stroke="#24231d" stroke-width="1.4" stroke-dasharray="5,4"/>
<text x="774" y="652" text-anchor="start" font-size="11" fill="#24231d" font-weight="bold">передпліччя · 2× Ø8 мм</text>
<text x="774" y="668" text-anchor="start" font-size="9" fill="#6b675c">0.8 Вт · місце ще уточнюємо</text>
<text x="760" y="308" text-anchor="start" font-size="11" fill="#24231d" font-weight="bold">Кожна лампа — своя пара до шин</text>
<text x="760" y="324" text-anchor="start" font-size="9" fill="#6b675c">перегоріла лампа рве тільки свою пару, шина живе</text>
<rect x="40" y="718" width="545" height="210" rx="6" fill="#fff" stroke="#d8d5c9" stroke-width="1.2"/>
<text x="58" y="744" text-anchor="start" font-size="12" fill="#24231d" font-weight="bold">Чому не послідовно</text>
<text x="58" y="768" text-anchor="start" font-size="11" fill="#b23a2e" font-weight="bold">Послідовно (ланцюжком):</text>
<text x="58" y="786" text-anchor="start" font-size="10" fill="#6b675c">струм тече крізь кожну лампу по черзі. Обрив у будь-якій —</text>
<text x="58" y="802" text-anchor="start" font-size="10" fill="#6b675c">і гасне вся лінія. Так ми не робимо.</text>
<text x="58" y="828" text-anchor="start" font-size="11" fill="#3d7a4f" font-weight="bold">Паралельно (наш варіант):</text>
<text x="58" y="846" text-anchor="start" font-size="10" fill="#6b675c">на кожній лампі повні 12 В — усі сидять на тих самих двох шинах.</text>
<text x="58" y="862" text-anchor="start" font-size="10" fill="#6b675c">Згасла одна — решта не помічають.</text>
<text x="58" y="888" text-anchor="start" font-size="11" fill="#24231d" font-weight="bold">Що таки може погасити все:</text>
<text x="58" y="906" text-anchor="start" font-size="10" fill="#6b675c">обрив магістральної пари до вузла або запобіжник групи.</text>
<rect x="615" y="718" width="525" height="210" rx="6" fill="#efeee7" stroke="#d8d5c9" stroke-width="1.2"/>
<text x="633" y="744" text-anchor="start" font-size="12" fill="#24231d" font-weight="bold">Чим саме зʼєднуємо</text>
<text x="633" y="768" text-anchor="start" font-size="10" fill="#6b675c">Важільні клеми Wago 221 у гелевому боксі,</text>
<text x="633" y="784" text-anchor="start" font-size="10" fill="#6b675c">або гелеві ковпачки на кінцях.</text>
<text x="633" y="810" text-anchor="start" font-size="10" fill="#6b675c">Важіль відкривається без інструмента — лампу знімають</text>
<text x="633" y="826" text-anchor="start" font-size="10" fill="#6b675c">і повертають прямо на плайї. Гель тримає пил 1–10 мкм</text>
<text x="633" y="842" text-anchor="start" font-size="10" fill="#6b675c">і нічний конденсат. Скрутка й ізолента — ні.</text>
<text x="633" y="868" text-anchor="start" font-size="10" fill="#6b675c">Магістраль іде всередині решітки корпусу, не по поверхні.</text>
<text x="633" y="894" text-anchor="start" font-size="10" fill="#6b675c">Скільки клем: стільки пар, скільки ламп на вузлі.</text>
<line x1="40" y1="956" x2="1140" y2="956" stroke="#d8d5c9" stroke-width="1.0"/>
<text x="40" y="974" text-anchor="start" font-size="10" fill="#6b675c">Місць на схемі 11, у специфікації 10 ламп — розбіжність усередині бази, показуємо як є, а не ховаємо.</text>
<text x="40" y="992" text-anchor="start" font-size="10" fill="#6b675c">Пунктиром — те, що ще не підтверджене: лампа на грудях видна лише спереду, місце двох Ø8 мм уточнюємо з конструктором.</text>
<text x="40" y="1010" text-anchor="start" font-size="10" fill="#6b675c">Довжина магістралі 6.0 м — прикидка, з креслення не знята. Стрічка подіуму живиться так само паралельно, але має свої точки живлення (power injection) — окрема схема.</text>
</svg>