<text x="138" y="190" text-anchor="start" font-size="10" fill="#eaf1ff">1.44 м — центр ядра</text>
<polyline points="299.3,180.5 315.3,164.5 462,164.5" fill="none" stroke="#26436e" stroke-width="1"/>
<text x="470" y="155" text-anchor="start" font-size="12" fill="#eaf1ff">ядро Ø180 мм на рівні лопаток</text>
<text x="470" y="170" text-anchor="start" font-size="10" fill="#8e97a6">модуль 241 діод Ø172 мм, 9 кілець</text>
<text x="470" y="185" text-anchor="start" font-size="10" fill="#8e97a6">вікно 1.6 мм, плата на 12 мм углиб</text>
<text x="470" y="200" text-anchor="start" font-size="10" fill="#8e97a6">рівного місця під посадку — Ø196 мм (вікно + поле 8 мм)</text>
<line x1="326.7" y1="235.8" x2="462" y2="235.8" stroke="#26436e" stroke-width="1"/>
<text x="470" y="242" text-anchor="start" font-size="12" fill="#eaf1ff">ребра панелі, крок 15-20 см</text>
<text x="470" y="257" text-anchor="start" font-size="10" fill="#8e97a6">зліва сітка 15 см, справа 20 см</text>
<text x="470" y="272" text-anchor="start" font-size="10" fill="#e08b3e">15 см — посадка не влазить у просвіт (-46 мм):</text>
<text x="470" y="287" text-anchor="start" font-size="10" fill="#e08b3e">ребро під ядром при будь-якому зсуві сітки</text>
<text x="470" y="302" text-anchor="start" font-size="10" fill="#8e97a6">20 см — вільних 4 мм: пролізе тільки якщо</text>
<text x="470" y="317" text-anchor="start" font-size="10" fill="#8e97a6">коло стане рівно між двома ребрами</text>
<text x="470" y="332" text-anchor="start" font-size="10" fill="#e08b3e">де саме ребра на спині — питання до Марселя</text>
<text x="470" y="347" text-anchor="start" font-size="10" fill="#8e97a6">фаза сітки невідома: задньої проєкції на Rev 2.1</text>
<text x="470" y="362" text-anchor="start" font-size="10" fill="#8e97a6">нема. Тому обидві сітки намальовані в найкращій</text>
<text x="470" y="377" text-anchor="start" font-size="10" fill="#8e97a6">для ядра фазі — рівно між ребрами; помаранчеве</text>
<text x="470" y="392" text-anchor="start" font-size="10" fill="#e08b3e">ребро тоді значить: не рятує і найвдаліший зсув</text>
<text x="415" y="26" text-anchor="middle" font-size="13" fill="#eaf1ff">Вигляд ззаду: ядро Ø180 мм на фігурі 2.0 м</text>
<text x="415" y="44" text-anchor="middle" font-size="10" fill="#8e97a6">центр на 1.44 м від настилу · крапки — лампи корпусу Ø12 і Ø8 мм у тому ж масштабі</text>
<text x="24" y="604" text-anchor="start" font-size="10" fill="#8e97a6">ядро ширше за лампу Ø12 мм у 15 разів у поперечнику і в 225 разів за площею</text>
<text x="24" y="621" text-anchor="start" font-size="10" fill="#8e97a6">силует умовний — пропорції людини в броні, а не креслення панелей спини</text>
<text x="24" y="638" text-anchor="start" font-size="10" fill="#8e97a6">подіум-октагон Ø2.59 м — прикидка: промінь стрічки плюс радіус центрального кола, зовнішній периметр у кресленні не заданий</text>
<text x="24" y="655" text-anchor="start" font-size="10" fill="#8e97a6">лампа на місці «груди» у цей вигляд не потрапляє — вона з іншого боку фігури; у базі вона є</text>
<text x="24" y="672" text-anchor="start" font-size="10" fill="#8e97a6">пунктирні крапки — 2 лампи Ø8 мм: база каже скільки їх, але не каже де</text>
<text x="24" y="689" text-anchor="start" font-size="10" fill="#8e97a6">у базі 8 ламп Ø12 мм, а місць в описі 9 — розбіжність показуємо, а не ховаємо</text>
</svg>