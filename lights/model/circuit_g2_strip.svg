<text x="290" y="215" text-anchor="middle" font-size="9" fill="#6b675c">Ancor 8/2 AWG · 5 м</text>
<text x="660" y="215" text-anchor="middle" font-size="9" fill="#6b675c">14/2 AWG · 4 м</text>
<text x="40" y="340" text-anchor="start" font-size="10" fill="#6b675c">Кабель WLED→стрічка довгий —</text>
<text x="40" y="358" text-anchor="start" font-size="10" fill="#6b675c">тому конденсатор на вході і</text>
<text x="40" y="376" text-anchor="start" font-size="10" fill="#6b675c">буфер на DATA не розкіш, а те,</text>
<text x="40" y="394" text-anchor="start" font-size="10" fill="#6b675c">без чого контролер скидається.</text>
<text x="40" y="440" text-anchor="start" font-size="10" fill="#24231d" font-weight="bold">Ввід у центрі, не з восьми</text>
<text x="40" y="458" text-anchor="start" font-size="10" fill="#6b675c">зовнішніх кінців: менше міді,</text>
<text x="40" y="476" text-anchor="start" font-size="10" fill="#6b675c">траса не йде по краю подіуму,</text>
<text x="40" y="494" text-anchor="start" font-size="10" fill="#6b675c">де на неї наступають.</text>
<text x="40" y="540" text-anchor="start" font-size="10" fill="#6b675c">Рукави підключені паралельно,</text>
<text x="40" y="558" text-anchor="start" font-size="10" fill="#6b675c">не ланцюжком: згас один —</text>
<text x="40" y="576" text-anchor="start" font-size="10" fill="#6b675c">решта світять як і раніше.</text>
<text x="40" y="610" text-anchor="start" font-size="10" fill="#6b675c">Напрямок хвилі задає реверс</text>
<text x="40" y="628" text-anchor="start" font-size="10" fill="#6b675c">сегмента у прошивці WLED, а не</text>
<text x="40" y="646" text-anchor="start" font-size="10" fill="#6b675c">те, з якого кінця прийшов дріт.</text>
<text x="40" y="680" text-anchor="start" font-size="10" fill="#b23a2e">Вдень стрічка вимкнена —</text>
<text x="40" y="698" text-anchor="start" font-size="10" fill="#b23a2e">чипи перегріваються на сонці.</text>
<line x1="40" y1="756" x2="1240" y2="756" stroke="#d8d5c9" stroke-width="1"/>
<text x="40" y="778" text-anchor="start" font-size="10" fill="#6b675c">Просадка WLED→вузол −0.21% (сукупно від щита −2.61%) при межі 5% для адресної лінії · струм 0.38 А.</text>
<text x="40" y="794" text-anchor="start" font-size="10" fill="#6b675c">Точки підживлення (power injection) на самому рукаві: Пара 14 AWG від центрального вузла, паяно в тому ж місці, що й вхід рукава — кількість точок рахує калькулятор вище.</text>
<text x="40" y="810" text-anchor="start" font-size="10" fill="#6b675c">Кабель від WLED до першого пікселя — не довше 30–50 см. Якщо довший — потрібен буфер 74HCT125 (рівневий зсув і відновлення форми сигналу), інакше викиди і помилки адресації на довгих лініях.</text>
<text x="40" y="826" text-anchor="start" font-size="10" fill="#6b675c">Місце вводу не диктує, куди біжить хвиля: напрямок сегмента реверсується в прошивці WLED. Затверджений ще в червні вигляд «вода біжить до центру» лишається, живлення від цього не залежить.</text>
<text x="40" y="842" text-anchor="start" font-size="10" fill="#6b675c">Вт на рукаві — нейплейт суцільного білого (ніколи не буває); реальний робочий пік 1.70 Вт на рукав при 10% біжучого фронту.</text>
</svg>