<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" width="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<text x="640" y="30" text-anchor="middle" font-size="15" fill="#24231d" font-weight="bold">Гр.2 · «біжуча вода» — адресна стрічка подіуму</text>
<text x="640" y="52" text-anchor="middle" font-size="11" fill="#6b675c">8 × 1.22 м · 17.0 Вт нейплейт на рукав · запобіжник Гр.2 5 А · робочий пік стрічки 13.6 Вт при 10% біжучого фронту</text>
<text x="640" y="72" text-anchor="middle" font-size="11" fill="#3d7a4f" font-weight="bold">Ввід живлення й даних — у центрі подіуму, не з восьми зовнішніх кінців: менше міді, і траса не лежить по краю, де на неї наступають.</text>
