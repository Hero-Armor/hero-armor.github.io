<rect x="40" y="150" width="180" height="150" rx="5" fill="#efeee7" stroke="#3d6f96" stroke-width="1.8"/>
<text x="130" y="172" text-anchor="middle" font-size="11" fill="#3d6f96" font-weight="bold">Щит подіуму</text>
<text x="130" y="188" text-anchor="middle" font-size="9" fill="#6b675c">запобіжник Гр.2 · 5 А</text>
<text x="130" y="202" text-anchor="middle" font-size="9" fill="#6b675c">реле 12 В / 30 А</text>
<text x="130" y="216" text-anchor="middle" font-size="9" fill="#6b675c">гасить групу цілком</text>
<rect x="360" y="150" width="260" height="150" rx="5" fill="#f5f4ef" stroke="#3d6f96" stroke-width="1.8"/>
<text x="490" y="172" text-anchor="middle" font-size="11" fill="#3d6f96" font-weight="bold">Коробка WLED · гермокоробка IP65</text>
<text x="490" y="188" text-anchor="middle" font-size="9" fill="#6b675c">ESP32 WLED (GLEDOPTO / QuinLED Dig)</text>
<text x="490" y="202" text-anchor="middle" font-size="9" fill="#6b675c">вхід 5-24В</text>
<text x="490" y="216" text-anchor="middle" font-size="9" fill="#6b675c">конденсатор 1000+ мкФ / 16В+</text>
<text x="490" y="230" text-anchor="middle" font-size="9" fill="#6b675c">буфер 74HCT125 на лінії DATA</text>
<rect x="700" y="201" width="540" height="48" rx="5" fill="#fff" stroke="#3d6f96" stroke-width="1.8"/>
<text x="970" y="229" text-anchor="middle" font-size="11" fill="#3d6f96" font-weight="bold">Центральний вузол під настилом · шина +12В / шина − / лінія DATA</text>
