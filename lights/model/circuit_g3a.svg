<rect x="40" y="170" width="200" height="120" rx="5" fill="#efeee7" stroke="#b23a2e" stroke-width="1.8"/>
<text x="140" y="192" text-anchor="middle" font-size="11" fill="#b23a2e" font-weight="bold">Щит подіуму</text>
<text x="140" y="208" text-anchor="middle" font-size="9" fill="#6b675c">запобіжник Гр.3А · 5 А</text>
<text x="140" y="222" text-anchor="middle" font-size="9" fill="#6b675c">реле 12 В / 30 А</text>
<text x="140" y="236" text-anchor="middle" font-size="9" fill="#6b675c">аварійна — своя, окремий канал</text>
<rect x="380" y="170" width="200" height="120" rx="5" fill="#f5f4ef" stroke="#b23a2e" stroke-width="1.8"/>
<text x="480" y="192" text-anchor="middle" font-size="11" fill="#b23a2e" font-weight="bold">Коробка аварійної лінії</text>
<text x="480" y="208" text-anchor="middle" font-size="9" fill="#6b675c">гермокоробка IP65</text>
<text x="480" y="222" text-anchor="middle" font-size="9" fill="#6b675c">розподіл на торець подіуму</text>
<rect x="720" y="206" width="500" height="48" rx="5" fill="#fff" stroke="#b23a2e" stroke-width="1.8"/>
<text x="970" y="234" text-anchor="middle" font-size="11" fill="#b23a2e" font-weight="bold">Кабель у каналі настилу · 10 м · 16/2 AWG у каналі настилу</text>
<rect x="725" y="380" width="60" height="80" rx="5" fill="#f5f4ef" stroke="#b23a2e" stroke-width="1.8"/>
<text x="755" y="402" text-anchor="middle" font-size="11" fill="#b23a2e" font-weight="bold">Грань 1</text>
<text x="755" y="418" text-anchor="middle" font-size="9" fill="#6b675c">3 × 0.6 Вт</text>
<text x="755" y="432" text-anchor="middle" font-size="9" fill="#6b675c">1.8 Вт</text>
<rect x="786" y="380" width="60" height="80" rx="5" fill="#f5f4ef" stroke="#b23a2e" stroke-width="1.8"/>
