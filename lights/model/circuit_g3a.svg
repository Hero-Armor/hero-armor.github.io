<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 900" width="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<text x="640" y="30" text-anchor="middle" font-size="15" fill="#24231d" font-weight="bold">Гр.3А · аварійна лінія — врізні вогні торця + маркер ящика</text>
<text x="640" y="52" text-anchor="middle" font-size="11" fill="#6b675c">24 × 0.6 Вт по торцю (по 3 на грань) + 2 × 0.24 Вт на ящику · пік групи 19.2 Вт · запобіжник 5 А · не регулюється диммером</text>
<text x="640" y="72" text-anchor="middle" font-size="11" fill="#3d7a4f" font-weight="bold">тримається найдовше — щоб подіум лишався видимим</text>
