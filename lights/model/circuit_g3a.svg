<text x="878" y="418" text-anchor="middle" font-size="9" fill="#6b675c">3 × 0.6 Вт</text>
<text x="878" y="432" text-anchor="middle" font-size="9" fill="#6b675c">1.8 Вт</text>
<rect x="909" y="380" width="60" height="80" rx="5" fill="#f5f4ef" stroke="#b23a2e" stroke-width="1.8"/>
<text x="939" y="402" text-anchor="middle" font-size="11" fill="#b23a2e" font-weight="bold">Грань 4</text>
<text x="939" y="418" text-anchor="middle" font-size="9" fill="#6b675c">3 × 0.6 Вт</text>
<text x="939" y="432" text-anchor="middle" font-size="9" fill="#6b675c">1.8 Вт</text>
<rect x="971" y="380" width="60" height="80" rx="5" fill="#f5f4ef" stroke="#b23a2e" stroke-width="1.8"/>
