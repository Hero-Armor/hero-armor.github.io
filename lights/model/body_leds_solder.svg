<text x="638.0" y="342.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">LED</text>
<line x1="522.0" y1="520" x2="638.0" y2="520" stroke="#0b8a3e" stroke-width="1.4"/>
<text x="580.0" y="538.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#0b8a3e" text-anchor="middle" font-weight="700">пояс — 2 шт</text>
<text x="580.0" y="554.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#9a9a9a" text-anchor="middle" font-weight="400">два по боках</text>
<text x="666.0" y="262.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">свій на кожен</text>
<text x="666.0" y="342.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">довга ніжка = плюс</text>
<text x="40.0" y="600.0" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="700">Який резистор ставити</text>
<text x="40.0" y="620.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#555" text-anchor="start" font-weight="400">Порахунок від шини 12 В. Беремо 1/2 Вт, а не 1/4: запас на спеку +40 °C.</text>
<text x="40.0" y="646.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9a9a9a" text-anchor="start" font-weight="700">колір світлодіода</text>
<text x="230.0" y="646.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9a9a9a" text-anchor="start" font-weight="700">струм</text>
<text x="320.0" y="646.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9a9a9a" text-anchor="start" font-weight="700">розрахунок</text>
<text x="430.0" y="646.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9a9a9a" text-anchor="start" font-weight="700">СТАВИМО</text>
<text x="560.0" y="646.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9a9a9a" text-anchor="start" font-weight="700">гріється</text>
<text x="40.0" y="668.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0b8a3e" text-anchor="start" font-weight="600">жовтий</text>
<text x="230.0" y="668.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0b8a3e" text-anchor="start" font-weight="400">10 мА</text>
<text x="320.0" y="668.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9a9a9a" text-anchor="start" font-weight="400">990 Ом</text>
<text x="430.0" y="668.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#0b8a3e" text-anchor="start" font-weight="700">1000 Ом</text>
<text x="560.0" y="668.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9a9a9a" text-anchor="start" font-weight="400">100 мВт</text>
<text x="40.0" y="687.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="400">жовтий</text>
<text x="230.0" y="687.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="400">15 мА</text>
<text x="320.0" y="687.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9a9a9a" text-anchor="start" font-weight="400">660 Ом</text>
<text x="430.0" y="687.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="700">680 Ом</text>
<text x="560.0" y="687.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9a9a9a" text-anchor="start" font-weight="400">153 мВт</text>
<text x="40.0" y="706.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="400">жовтий</text>
<text x="230.0" y="706.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="400">20 мА</text>
<text x="320.0" y="706.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9a9a9a" text-anchor="start" font-weight="400">495 Ом</text>
<text x="430.0" y="706.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="700">510 Ом</text>
<text x="560.0" y="706.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9a9a9a" text-anchor="start" font-weight="400">204 мВт</text>
<text x="40.0" y="725.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0b8a3e" text-anchor="start" font-weight="600">білий або синій</text>
<text x="230.0" y="725.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#0b8a3e" text-anchor="start" font-weight="400">10 мА</text>
<text x="320.0" y="725.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9a9a9a" text-anchor="start" font-weight="400">900 Ом</text>
<text x="430.0" y="725.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#0b8a3e" text-anchor="start" font-weight="700">910 Ом</text>
<text x="560.0" y="725.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9a9a9a" text-anchor="start" font-weight="400">91 мВт</text>
<text x="40.0" y="744.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="400">білий або синій</text>
<text x="230.0" y="744.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="400">15 мА</text>
<text x="320.0" y="744.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9a9a9a" text-anchor="start" font-weight="400">600 Ом</text>
<text x="430.0" y="744.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="700">620 Ом</text>
<text x="560.0" y="744.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9a9a9a" text-anchor="start" font-weight="400">139 мВт</text>
<text x="40.0" y="763.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="400">білий або синій</text>
<text x="230.0" y="763.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#1b1b1b" text-anchor="start" font-weight="400">20 мА</text>
<text x="320.0" y="763.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9a9a9a" text-anchor="start" font-weight="400">450 Ом</text>
<text x="430.0" y="763.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="700">470 Ом</text>
<text x="560.0" y="763.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#9a9a9a" text-anchor="start" font-weight="400">188 мВт</text>
<text x="40.0" y="798.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#0b8a3e" text-anchor="start" font-weight="400">Зеленим — рекомендація: 10 мА. На 12 В колір впливає на струм лише на 9%, тому 1 кОм можна ставити не розбираючись.</text>
<text x="760.0" y="600.0" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#1b1b1b" text-anchor="start" font-weight="700">Перед паянням</text>
<text x="760.0" y="628.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="700">· Який у вас світлодіод</text>
<text x="770.0" y="644.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">Жовтий — 2.1 В, білий і синій — 3 В. Якщо не знаєте:</text>
<text x="770.0" y="658.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">мультиметр у режимі перевірки діода покаже пряму</text>
<text x="770.0" y="672.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">напругу.</text>
<text x="760.0" y="690.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="700">· Де плюс</text>
<text x="770.0" y="706.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">Довга ніжка — плюс. Якщо ніжки вже обрізані: у</text>
<text x="770.0" y="720.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">мультиметрі режим діода, світлодіод блимне, коли</text>
<text x="770.0" y="734.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">червоний щуп на плюсі.</text>
<text x="760.0" y="752.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="700">· Резистор — у плюсовий провід</text>
<text x="770.0" y="768.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">Електрично байдуже, але так плюс скрізь через</text>
<text x="770.0" y="782.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">резистор, і випадкове коротке на корпус не спалить</text>
<text x="770.0" y="796.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">світлодіод.</text>
<text x="760.0" y="814.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="700">· Кожен резистор — у термоусадку</text>
<text x="770.0" y="830.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">Голий вивід у закритому корпусі знизу — це замикання,</text>
<text x="770.0" y="844.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">яке ви побачите вже на плайї.</text>
<text x="760.0" y="876.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="700">· Не паяйте все в один вузол</text>
<text x="770.0" y="892.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">Клемник або WAGO знизу: один світлодіод відмовив —</text>
<text x="770.0" y="906.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">міняється окремо, без розпаювання всієї групи.</text>
<text x="760.0" y="938.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="700">· Свій запобіжник</text>
<text x="770.0" y="954.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">Уся група бере копійки: 6 × 10 мА = 60 мА, менше</text>
<text x="770.0" y="968.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">вата. Запобіжник 1 А на групу — цього досить.</text>
<text x="40.0" y="976.0" font-family="Arial,Helvetica,sans-serif" font-size="11" fill="#c2660a" text-anchor="start" font-weight="400">Варіант, якщо резисторів шкода: два світлодіоди ПОСЛІДОВНО на пару (пояс окремо, шолом окремо) — тоді 750 Ом на 10 мА, удвічі менше резисторів і тепла.</text>
</svg>
