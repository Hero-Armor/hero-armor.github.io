<text x="286.0" y="518.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#0b8a3e" text-anchor="middle" font-weight="700">шолом — 4 шт</text>
<text x="286.0" y="534.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#9a9a9a" text-anchor="middle" font-weight="400">над очима, справа і зліва</text>
