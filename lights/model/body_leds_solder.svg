<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1010" viewBox="0 0 1240 1010">
<rect width="1240" height="1010" fill="#ffffff"/>
<text x="40.0" y="36.0" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#1b1b1b" text-anchor="start" font-weight="700">Світлодіоди на корпусі — що з чим паяти знизу</text>
<text x="40.0" y="58.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#555" text-anchor="start" font-weight="400">Корпус закритий, дроти виведені вниз. Кожна гілка однакова: плюс шини → резистор → світлодіод → мінус шини.</text>
<text x="40.0" y="76.0" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#d81f1f" text-anchor="start" font-weight="600">У КОЖНОГО світлодіода свій резистор. Два світлодіоди на один резистор паралельно вішати не можна.</text>
<line x1="120" y1="150" x2="620" y2="150" stroke="#d81f1f" stroke-width="3.5"/>
<line x1="120" y1="470" x2="620" y2="470" stroke="#1b1b1b" stroke-width="3.5"/>
<text x="110.0" y="154.0" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#d81f1f" text-anchor="end" font-weight="700">+12 В</text>
<text x="110.0" y="474.0" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#1b1b1b" text-anchor="end" font-weight="700">мінус</text>
<text x="110.0" y="134.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="end" font-weight="400">від щита, група Гр.2</text>
