<text x="554.0" y="242.0" font-family="Arial,Helvetica,sans-serif" font-size="11.5" fill="#1b1b1b" text-anchor="start" font-weight="700">R</text>
<text x="554.0" y="322.0" font-family="Arial,Helvetica,sans-serif" font-size="10.5" fill="#555" text-anchor="start" font-weight="400">LED</text>
