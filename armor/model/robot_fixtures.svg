<text x="52" y="682" text-anchor="start" font-size="11" fill="#6b675c">активне світло: лампи на корпусі і ядро на спині</text>
<rect x="28" y="690" width="12" height="12" fill="#ffffff" stroke="#3d6f96" stroke-width="1.8" stroke-dasharray="4 6"/>
<text x="52" y="700" text-anchor="start" font-size="11" fill="#6b675c">вікно радара — тільки діелектрик, крізь метал не бачить</text>
<circle cx="34" cy="714" r="6" fill="#ffffff" stroke="#3d7a4f" stroke-width="1.8"/>
