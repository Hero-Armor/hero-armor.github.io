<text x="52" y="718" text-anchor="start" font-size="11" fill="#6b675c">динамік мембраною вниз, гриль і протипилова тканина</text>
<rect x="26" y="727" width="16" height="10" fill="#ffffff" stroke="#24231d" stroke-width="1.5"/>
<rect x="26" y="745" width="16" height="10" fill="#f2e9d2" stroke="#b07c14" stroke-width="1.5"/>
<text x="52" y="736" text-anchor="start" font-size="11" fill="#6b675c">світловідбивна стрічка: №3 і №4 білі,</text>
<text x="52" y="754" text-anchor="start" font-size="11" fill="#6b675c">№5 жовта — ріжеться по формі місця</text>
<text x="52" y="772" text-anchor="start" font-size="11" fill="#6b675c">№ — номер позиції у специфікації конструктора</text>
<line x1="26" y1="786" x2="42" y2="786" stroke="#6b675c" stroke-width="1.8" stroke-dasharray="4 6"/>
<text x="52" y="790" text-anchor="start" font-size="11" fill="#6b675c">пунктир — місце припущене, у кресленні його нема</text>
<text x="470" y="682" text-anchor="start" font-size="11" fill="#6b675c">у базі 8 ламп Ø12 мм, а місць в описі 9 — розбіжність показуємо</text>
<text x="470" y="700" text-anchor="start" font-size="11" fill="#6b675c">лампи стоять у передній стінці оболонки — ззаду їх не видно</text>
<text x="470" y="718" text-anchor="start" font-size="11" fill="#6b675c">позначка лампи збільшена: у масштабі схеми Ø12 мм — це 2.8 точки</text>
<text x="470" y="736" text-anchor="start" font-size="11" fill="#6b675c">місця стрічки і вікна радара умовні — у кресленні їх нема</text>
<text x="470" y="754" text-anchor="start" font-size="11" fill="#6b675c">ядро на спині — своя схема і свої числа, тут воно для масштабу</text>
</svg>