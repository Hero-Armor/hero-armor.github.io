<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 716" width="100%" font-family="ui-monospace,Menlo,monospace">
<defs><marker id="site-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d6f96"/></marker><marker id="site-wind" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07c14"/></marker><marker id="site-go" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3d7a4f"/></marker><marker id="site-dir" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#24231d"/></marker></defs>
<text x="480" y="24" text-anchor="middle" font-size="14" fill="#24231d" font-weight="600">Розкладка на плайї: подіум, ящик станції і сонячний масив</text>
<text x="480" y="42" text-anchor="middle" font-size="11" fill="#6b675c">подіум 2.44 м через вершини · кабель до станції ≈7.6 м · станція і масив ще не обрані</text>
<text x="480" y="58" text-anchor="middle" font-size="11" fill="#6b675c">північ угорі, полудневе сонце знизу · вітер, сонце і бік під'їзду — типові для плайї, точно розмічаємо на місці</text>
<line x1="60" y1="200" x2="60" y2="160" stroke="#24231d" stroke-width="1.8" marker-end="url(#site-dir)"/>
<text x="60" y="151" text-anchor="middle" font-size="11" fill="#24231d">північ</text>
<text x="330" y="124" font-size="11" fill="#3d7a4f">звідси під'їжджають велосипеди й арт-кари</text>
<text x="330" y="140" font-size="11" fill="#6b675c">з боку відкритої плайї</text>
<line x1="300" y1="180" x2="260" y2="235" stroke="#3d7a4f" stroke-width="3" marker-end="url(#site-go)"/>
<text x="195" y="172" text-anchor="middle" font-size="13" fill="#24231d">подіум 2.44 м через вершини</text>
<text x="195" y="188" text-anchor="middle" font-size="11" fill="#6b675c">торець 0.18 м · 8 кутів · 8 стійок прожекторів у вершинах</text>
<text x="195" y="204" text-anchor="middle" font-size="11" fill="#6b675c">стійки показані умовно крупніше</text>
<rect x="735.5" y="217.0" width="165.9" height="165.9" rx="6" fill="#c9c5b6" fill-opacity="0.3" stroke="#6b675c" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="819" y="196" text-anchor="middle" font-size="11" fill="#b07c14">без тіні станція виходить за +45 °C</text>
<text x="819" y="212" text-anchor="middle" font-size="11" fill="#6b675c">навіс 2.44×2.44 м — прикидка, місце ще не розмічене</text>
<polygon points="195.0,217.1 136.4,241.4 112.1,300.0 136.4,358.6 195.0,382.9 253.6,358.6 277.9,300.0 253.6,241.4" fill="#ffffff" stroke="#24231d" stroke-width="1.8"/>
<circle cx="195" cy="300" r="40.1" fill="none" stroke="#c9c6ba" stroke-width="1.5" stroke-dasharray="4 6"/>
<circle cx="179.6" cy="300" r="2.4" fill="#24231d"/>
<circle cx="210.4" cy="300" r="2.4" fill="#24231d"/>
<text x="195" y="326" text-anchor="middle" font-size="11" fill="#24231d">фігура</text>
<circle cx="195.0" cy="217.1" r="4" fill="#ffffff" stroke="#24231d" stroke-width="1.6"/>
<circle cx="136.4" cy="241.4" r="4" fill="#ffffff" stroke="#24231d" stroke-width="1.6"/>
<circle cx="112.1" cy="300.0" r="4" fill="#ffffff" stroke="#24231d" stroke-width="1.6"/>
<circle cx="136.4" cy="358.6" r="4" fill="#ffffff" stroke="#24231d" stroke-width="1.6"/>
<circle cx="195.0" cy="382.9" r="4" fill="#ffffff" stroke="#24231d" stroke-width="1.6"/>
<circle cx="253.6" cy="358.6" r="4" fill="#ffffff" stroke="#24231d" stroke-width="1.6"/>
<circle cx="277.9" cy="300.0" r="4" fill="#ffffff" stroke="#24231d" stroke-width="1.6"/>
<circle cx="253.6" cy="241.4" r="4" fill="#ffffff" stroke="#24231d" stroke-width="1.6"/>
<line x1="76" y1="454" x2="130" y2="368" stroke="#b07c14" stroke-width="3" marker-end="url(#site-wind)"/>
<text x="52" y="486" font-size="11" fill="#b07c14">вітер і пил</text>
<text x="52" y="502" font-size="11" fill="#b07c14">напрямок: південний захід</text>
<line x1="278" y1="300" x2="795" y2="300" stroke="#b35b1e" stroke-width="2.5"/>
<text x="507" y="276" text-anchor="middle" font-size="11" fill="#b35b1e">магістраль світла AWG 8 · звук іде своїм кабелем</text>
<line x1="278" y1="306" x2="278" y2="336" stroke="#d8d5c9" stroke-width="0.8"/>
<line x1="795" y1="321" x2="795" y2="336" stroke="#d8d5c9" stroke-width="0.8"/>
<line x1="278" y1="330" x2="795" y2="330" stroke="#3d6f96" stroke-width="1.5" marker-start="url(#site-dim)" marker-end="url(#site-dim)"/>
<text x="507" y="322" text-anchor="middle" font-size="11" fill="#3d6f96">≈7.6 м</text>
<text x="507" y="352" text-anchor="middle" font-size="11" fill="#6b675c">це довжина кабелю станція → щит, прикидка;</text>
<text x="507" y="368" text-anchor="middle" font-size="11" fill="#6b675c">по землі відстань менша — міряємо після складання</text>
<text x="507" y="392" text-anchor="middle" font-size="11" fill="#b23a2e">об цю трасу спотикаються вночі: за правилом</text>
<text x="507" y="408" text-anchor="middle" font-size="11" fill="#b23a2e">її треба світити, а не лише позначити</text>
<text x="507" y="424" text-anchor="middle" font-size="11" fill="#6b675c">чим саме — стрічкою, лотком чи підняти —</text>
<text x="507" y="440" text-anchor="middle" font-size="11" fill="#6b675c">ще не вирішено</text>
<rect x="794.7" y="283.0" width="47.6" height="34.0" rx="3" fill="#ffffff" stroke="#24231d" stroke-width="1.8"/>
<rect x="801.6" y="291.8" width="33.8" height="16.5" rx="2" fill="#e8e4d6" stroke="#24231d" stroke-width="1.5"/>
<text x="819" y="240" text-anchor="middle" font-size="13" fill="#24231d">ящик станції</text>
<text x="819" y="256" text-anchor="middle" font-size="11" fill="#6b675c">поки рахуємо по Delta 2 Max: 2048 Вт·год, 23 кг</text>
<text x="819" y="272" text-anchor="middle" font-size="11" fill="#6b675c">ні станція, ні розмір ящика ще не обрані</text>
<line x1="819" y1="317" x2="819" y2="410" stroke="#b35b1e" stroke-width="2.5"/>
<text x="787" y="400" text-anchor="end" font-size="11" fill="#b35b1e">кабель масиву</text>
<rect x="747.1" y="410.2" width="142.8" height="88.3" rx="3" fill="#efeee7" stroke="#24231d" stroke-width="1.8"/>
<line x1="819" y1="424" x2="819" y2="486" stroke="#24231d" stroke-width="1.8" marker-end="url(#site-dir)"/>
<text x="819" y="522" text-anchor="middle" font-size="13" fill="#24231d">сонячний масив</text>
<text x="819" y="538" text-anchor="middle" font-size="11" fill="#6b675c">600 Вт з повзунка ≈ 3 модулі по 200 Вт</text>
<text x="819" y="554" text-anchor="middle" font-size="11" fill="#6b675c">нахил 30°, дивиться на південь</text>
<text x="819" y="570" text-anchor="middle" font-size="11" fill="#6b675c">потужність ще не обрана</text>
<text x="340" y="505" font-size="11" fill="#6b675c">масштаб</text>
<line x1="340" y1="515" x2="544" y2="515" stroke="#24231d" stroke-width="1.5"/>
<line x1="340" y1="510" x2="340" y2="520" stroke="#24231d" stroke-width="1.5"/>
<line x1="408" y1="510" x2="408" y2="520" stroke="#24231d" stroke-width="1.5"/>
<line x1="476" y1="510" x2="476" y2="520" stroke="#24231d" stroke-width="1.5"/>
<line x1="544" y1="510" x2="544" y2="520" stroke="#24231d" stroke-width="1.5"/>
<text x="340" y="533" text-anchor="middle" font-size="11" fill="#6b675c">0</text>
<text x="544" y="533" text-anchor="middle" font-size="11" fill="#6b675c">3 м</text>
<text x="24" y="540" font-size="11" fill="#6b675c">вночі подіум тримає аварійна група: 24 врізних вогнів у торці,</text>
<text x="24" y="556" font-size="11" fill="#6b675c">ящик має 2 маркерні вогники у стінках, катафоти й стрічку по боках —</text>
<text x="24" y="572" font-size="11" fill="#6b675c">усе це на окремій схемі нічної помітності</text>
<polygon points="40.0,591.0 35.1,593.1 33.0,598.0 35.1,602.9 40.0,605.0 44.9,602.9 47.0,598.0 44.9,593.1" fill="#ffffff" stroke="#24231d" stroke-width="1.6"/>
<text x="56" y="602" font-size="11" fill="#6b675c">подіум: 8 кутів, 8 стійок прожекторів у вершинах</text>
<circle cx="40" cy="620" r="7" fill="none" stroke="#c9c6ba" stroke-width="1.5" stroke-dasharray="4 6"/>
<circle cx="40" cy="620" r="2.4" fill="#24231d"/>
<text x="56" y="624" font-size="11" fill="#6b675c">штрихове коло — габарит фігури по розмаху рук 1.18 м, крапки — опорні труби ніг</text>
<rect x="32" y="637" width="16" height="11" fill="#ffffff" stroke="#24231d" stroke-width="1.6"/>
<rect x="36" y="639" width="8" height="7" fill="#e8e4d6" stroke="#24231d" stroke-width="1.5"/>
<text x="56" y="646" font-size="11" fill="#6b675c">ящик станції, всередині — сама станція</text>
<rect x="32" y="659" width="16" height="10" fill="#efeee7" stroke="#24231d" stroke-width="1.8"/>
<text x="56" y="668" font-size="11" fill="#6b675c">рама сонячного масиву</text>
<rect x="32" y="681" width="16" height="10" fill="#c9c5b6" fill-opacity="0.3" stroke="#6b675c" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="56" y="690" font-size="11" fill="#6b675c">пунктир навколо ящика — межа тіньового навісу</text>
<line x1="510" y1="598" x2="530" y2="598" stroke="#b35b1e" stroke-width="2.5"/>
<text x="538" y="602" font-size="11" fill="#6b675c">живлення: магістраль світла і кабель масиву</text>
<line x1="510" y1="620" x2="530" y2="620" stroke="#3d6f96" stroke-width="1.5" marker-start="url(#site-dim)" marker-end="url(#site-dim)"/>
<text x="538" y="624" font-size="11" fill="#6b675c">синя лінія з двома стрілками — розмір</text>
<line x1="510" y1="642" x2="530" y2="642" stroke="#24231d" stroke-width="1.8" marker-end="url(#site-dir)"/>
<text x="538" y="646" font-size="11" fill="#6b675c">чорна стрілка — напрямок: північ і куди дивиться масив</text>
<line x1="510" y1="664" x2="530" y2="664" stroke="#b07c14" stroke-width="2.5" marker-end="url(#site-wind)"/>
<text x="538" y="668" font-size="11" fill="#6b675c">звідки дме вітер і йде пил</text>
<line x1="510" y1="686" x2="530" y2="686" stroke="#3d7a4f" stroke-width="2.5" marker-end="url(#site-go)"/>
<text x="538" y="690" font-size="11" fill="#6b675c">звідки під'їжджають люди</text>
</svg>