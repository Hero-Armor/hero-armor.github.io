<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560">
<rect width="1180" height="560" fill="#fcfcfb"/>
<style>text{font-family:-apple-system,Segoe UI,Roboto,sans-serif}.h{font-size:23px;font-weight:700}.s{font-size:14px}.t{font-size:15px}.p{font-size:16px;font-weight:700}.m{font-size:13px;fill:#52514e}.k{font-size:15px;font-weight:700}</style>
<text class="h" x="30" y="44" fill="#0b0b0b">Чому помаранчева і зелена йдуть навхрест</text>
<text class="s" x="30" y="72" fill="#52514e">TX — це рот, він говорить. RX — це вухо, воно слухає. Рот одного йде у вухо іншого.</text>
<rect x="30" y="104" width="330" height="232" rx="12" fill="#eef3f8" stroke="#c2d2e2" stroke-width="2"/>
<text class="p" x="52" y="136" fill="#0b0b0b">Радар LD2410C</text>
<rect x="820" y="104" width="330" height="232" rx="12" fill="#eef3f8" stroke="#c2d2e2" stroke-width="2"/>
<text class="p" x="842" y="136" fill="#0b0b0b">ESP32 у коробці</text>
<rect x="300" y="184" width="30" height="30" rx="4" fill="#111"/>
<text class="k" x="286" y="206" fill="#0b0b0b" text-anchor="end">TX</text>
<text class="m" x="286" y="226" text-anchor="end">рот радара</text>
<rect x="300" y="272" width="30" height="30" rx="4" fill="#111"/>
<text class="k" x="286" y="294" fill="#0b0b0b" text-anchor="end">RX</text>
<text class="m" x="286" y="314" text-anchor="end">вухо радара</text>
<rect x="850" y="184" width="30" height="30" rx="4" fill="#111"/>
<text class="k" x="894" y="206" fill="#0b0b0b">TX2 · GPIO17</text>
<text class="m" x="894" y="226">рот плати</text>
<rect x="850" y="272" width="30" height="30" rx="4" fill="#111"/>
<text class="k" x="894" y="294" fill="#0b0b0b">RX2 · GPIO16</text>
<text class="m" x="894" y="314">вухо плати</text>
<path d="M330,200 C520,200 660,288 850,288" fill="none" stroke="#eb6834" stroke-width="8"/>
<path d="M330,288 C520,288 660,200 850,200" fill="none" stroke="#1baf7a" stroke-width="8"/>
<text class="t" x="590" y="166" fill="#eb6834" text-anchor="middle" font-weight="700">помаранчева</text>
<text class="m" x="590" y="186" text-anchor="middle">радар говорить — плата слухає</text>
<text class="t" x="590" y="342" fill="#1baf7a" text-anchor="middle" font-weight="700">зелена</text>
<text class="m" x="590" y="362" text-anchor="middle">плата говорить — радар слухає</text>
<text class="t" x="30" y="396" fill="#c2410c" font-weight="700">Та сама жила на двох кінцях сидить на контактах із РІЗНИМИ підписами — і це правильно.</text>
<text class="s" x="30" y="424" fill="#52514e">Помаранчева: біля радара на контакті «TX», у коробці на контакті «RX2».</text>
<text class="s" x="30" y="448" fill="#52514e">Зелена: біля радара на контакті «RX», у коробці на контакті «TX2».</text>
<text class="s" x="30" y="480" fill="#52514e">Якщо з’єднати однойменно (TX з TX) — нічого не згорить, але обидва говорять і ніхто не слухає: по UART буде тиша.</text>
<text class="s" x="30" y="504" fill="#1baf7a" font-weight="700">Решта три жили — БЕЗ жодного перехрещення: синя VCC у +5 В, коричнева OUT у GPIO27, усі білі в землю.</text>
</svg>