<text x="270.0" y="462.0" font-family="Helvetica, Arial" font-size="11" text-anchor="middle" font-weight="normal">Ø90 — фланець динаміка зсередини</text>
<text x="365.0" y="499.0" font-family="Helvetica, Arial" font-size="11" text-anchor="middle" font-weight="normal">суцільне зовнішнє коло — фланець динаміка · штрихове — розмітка R 30 з креслення 17.06 · чотири отвори Ø4 під саморізи</text>
<text x="850.0" y="30.0" font-family="Helvetica, Arial" font-size="14" text-anchor="middle" font-weight="bold">Розріз — динамік притиснутий зсередини</text>
<rect x="700.0" y="130.0" width="10.2" height="374.0" fill="#e8e8e8" stroke="#000" stroke-width="1.4"/>
<text x="705.1" y="120.0" font-family="Helvetica, Arial" font-size="11" text-anchor="middle" font-weight="normal">панель броні 1.6–3 мм — БЕЗ отвору</text>
<rect x="710.2" y="164.0" width="20.4" height="306.0" fill="#d0d0d0" stroke="#000" stroke-width="1.4"/>
<text x="738.6" y="490.0" font-family="Helvetica, Arial" font-size="11" text-anchor="start" font-weight="normal">фланець тисне зсередини</text>
