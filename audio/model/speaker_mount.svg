<text x="872.0" y="321.0" font-family="Helvetica, Arial" font-size="11" text-anchor="start" font-weight="normal">Ø72</text>
<text x="590.0" y="590.0" font-family="Helvetica, Arial" font-size="11" text-anchor="middle" font-weight="normal">За обшивкою ~140 мм порожнього каркаса — по глибині влазить будь-який варіант.</text>
<text x="590.0" y="611.0" font-family="Helvetica, Arial" font-size="11" text-anchor="middle" font-weight="normal">Мембраною ВНИЗ (нахил ~90°): так пил не сідає на конус, а вода стікає.</text>
<text x="590.0" y="632.0" font-family="Helvetica, Arial" font-size="11" text-anchor="middle" font-weight="normal">Фланець тисне обшивку зовні через тонку прокладку; шов по колу — силіконом.</text>
<text x="590.0" y="684.0" font-family="Helvetica, Arial" font-size="11" text-anchor="middle" font-weight="normal">Креслення нашого боку. Остаточний Ø у броні і місце (груди Ø60 чи живіт) — за конструктором: питання відкрите з 24.07.</text>
