<text x="892.4" y="321.0" font-family="Helvetica, Arial" font-size="11" text-anchor="start" font-weight="normal">Ø72 корпус</text>
<text x="590.0" y="590.0" font-family="Helvetica, Arial" font-size="11" text-anchor="middle" font-weight="normal">Динамік кріпиться до панелі ЗСЕРЕДИНИ: фланець притискається до внутрішнього боку, наскрізного отвору нема.</text>
<text x="590.0" y="611.0" font-family="Helvetica, Arial" font-size="11" text-anchor="middle" font-weight="normal">Броня в цьому місці кілька міліметрів — звук проходить (рішення 3D-конструктора 25.07).</text>
<text x="590.0" y="632.0" font-family="Helvetica, Arial" font-size="11" text-anchor="middle" font-weight="normal">Якщо на місці звук глухий — кілька тонких отворів гарячим ножем, схованих у геометрії поруч. Це крайній випадок.</text>
<text x="590.0" y="684.0" font-family="Helvetica, Arial" font-size="11" text-anchor="middle" font-weight="normal">Місце за кресленням В. Кормільця 17.06 (R 30 на нижній грудній панелі). Глибина каркаса в цьому місці ~140 мм + 2-3 см до оболонки, 27.07 передню металеву частину прибрано — по глибині вільно.</text>
</svg>