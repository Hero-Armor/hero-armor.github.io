<text x="270.0" y="499.0" font-family="Helvetica, Arial" font-size="11" text-anchor="middle" font-weight="normal">чотири отвори Ø4 по колу Ø82 · штрихове коло — межа отвору, суцільне зовнішнє — фланець</text>
<text x="850.0" y="30.0" font-family="Helvetica, Arial" font-size="14" text-anchor="middle" font-weight="bold">Розріз — як динамік сідає в обшивку</text>
