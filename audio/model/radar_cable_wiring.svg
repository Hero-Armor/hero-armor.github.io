<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720">
<rect width="1180" height="720" fill="#fcfcfb"/>
<style>text{font-family:-apple-system,Segoe UI,Roboto,sans-serif}.h{font-size:21px;font-weight:700}.s{font-size:13px}.t{font-size:14px}.m{font-size:12px;fill:#52514e}</style>
<text class="h" x="28" y="40" fill="#0b0b0b">Радар LD2410C на витій парі Cat6 — що куди паяти</text>
<text class="s" x="28" y="64" fill="#52514e">Правило одне: КОЛІР — сигнал, БІЛА зі смужкою того ж кольору — його земля. Кожен сигнал скручений зі своєю землею, а не з чужим сигналом.</text>
<rect x="28" y="92" width="270" height="430" rx="10" fill="none" stroke="#e8e7e3" stroke-width="2"/>
<text class="t" x="44" y="118" fill="#0b0b0b" font-weight="700">Коробка в подіумі</text>
<text class="m" x="44" y="138">ESP32 + ЦАП + понижайка</text>
<rect x="882" y="92" width="270" height="430" rx="10" fill="none" stroke="#e8e7e3" stroke-width="2"/>
<text class="t" x="898" y="118" fill="#0b0b0b" font-weight="700">Радар у фігурі</text>
<text class="m" x="898" y="138">підписи читати з плати, не з кольору дроту</text>
<line x1="298" y1="176" x2="882" y2="176" stroke="#2a78d6" stroke-width="5"/>
<line x1="298" y1="198" x2="882" y2="198" stroke="#2a78d6" stroke-width="5" stroke-dasharray="9 7"/>
<text class="t" x="590" y="168" fill="#0b0b0b" text-anchor="middle">синя — +5 В</text>
<text class="m" x="590" y="216" text-anchor="middle">біла зі смужкою (синя) — земля цієї пари</text>
<text class="t" x="286" y="181" fill="#0b0b0b" text-anchor="end">buck 12→5 В, вихід +5 В</text>
<text class="t" x="894" y="181" fill="#0b0b0b">VCC</text>
<text class="m" x="286" y="203" text-anchor="end">GND</text>
<text class="m" x="894" y="203">GND</text>
<line x1="298" y1="264" x2="882" y2="264" stroke="#eb6834" stroke-width="5"/>
<line x1="298" y1="286" x2="882" y2="286" stroke="#eb6834" stroke-width="5" stroke-dasharray="9 7"/>
<text class="t" x="590" y="256" fill="#0b0b0b" text-anchor="middle">помаранчева — TX радара</text>
<text class="m" x="590" y="304" text-anchor="middle">біла зі смужкою (помаранчева) — земля цієї пари</text>
<text class="t" x="286" y="269" fill="#0b0b0b" text-anchor="end">ESP32 GPIO16 (RX2)</text>
<text class="t" x="894" y="269" fill="#0b0b0b">TX</text>
<text class="m" x="286" y="291" text-anchor="end">GND</text>
<text class="m" x="894" y="291">GND</text>
<line x1="298" y1="352" x2="882" y2="352" stroke="#1baf7a" stroke-width="5"/>
<line x1="298" y1="374" x2="882" y2="374" stroke="#1baf7a" stroke-width="5" stroke-dasharray="9 7"/>
<text class="t" x="590" y="344" fill="#0b0b0b" text-anchor="middle">зелена — RX радара</text>
<text class="m" x="590" y="392" text-anchor="middle">біла зі смужкою (зелена) — земля цієї пари</text>
<text class="t" x="286" y="357" fill="#0b0b0b" text-anchor="end">ESP32 GPIO17 (TX2)</text>
<text class="t" x="894" y="357" fill="#0b0b0b">RX</text>
<text class="m" x="286" y="379" text-anchor="end">GND</text>
<text class="m" x="894" y="379">GND</text>
<line x1="298" y1="440" x2="882" y2="440" stroke="#8b5a2b" stroke-width="5"/>
<line x1="298" y1="462" x2="882" y2="462" stroke="#8b5a2b" stroke-width="5" stroke-dasharray="9 7"/>
<text class="t" x="590" y="432" fill="#0b0b0b" text-anchor="middle">коричнева — OUT</text>
<text class="m" x="590" y="480" text-anchor="middle">біла зі смужкою (коричнева) — земля цієї пари</text>
<text class="t" x="286" y="445" fill="#0b0b0b" text-anchor="end">ESP32 GPIO27 (D27)</text>
<text class="t" x="894" y="445" fill="#0b0b0b">OUT</text>
<text class="m" x="286" y="467" text-anchor="end">GND</text>
<text class="m" x="894" y="467">GND</text>
<text class="t" x="28" y="566" fill="#c2410c" font-weight="700">Екран — тільки з боку коробки</text>
<text class="s" x="28" y="588" fill="#52514e">Дренажну жилу і фольгу паяємо на землю в коробці. З боку радара екран відкусити і закрити термоусадкою: земля з двох кінців дає петлю.</text>
<text class="s" x="28" y="614" fill="#c2410c" font-weight="700">TX радара йде на RX плати, RX радара — на TX плати. Навхрест, не однойменно.</text>
<text class="s" x="28" y="638" fill="#52514e">Усі чотири білі жили зводяться разом в одну землю на обох кінцях. Просадка на 3 м при 80 мА — 20 мВ, живлення однієї жили вистачає з запасом.</text>
</svg>